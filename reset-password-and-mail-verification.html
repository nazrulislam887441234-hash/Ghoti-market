<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাকাউন্ট অ্যাকশন - ঘটি মার্কেট</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #1a2a3a, #2c3e50); --success: #2ecc71; --danger: #e74c3c; }
        body { font-family: 'Hind Siliguri', sans-serif; background: var(--primary-gradient); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .container { background: rgba(255, 255, 255, 0.98); padding: 40px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); width: 100%; max-width: 400px; text-align: center; }
        .logo { width: 100px; height: 100px; margin-bottom: 15px; }
        h2 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; }
        .status-icon { font-size: 50px; margin-bottom: 15px; display: none; }
        #message { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; font-weight: 600; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://ghotimarket.com/logo.png" alt="Ghoti Market" class="logo">
    <h2 id="title">প্রসেসিং হচ্ছে...</h2>
    
    <div id="status-icon" class="status-icon"></div>
    <div id="message"></div>
    
    <div id="reset-area" style="display:none;">
        <input type="password" id="new-password" placeholder="নতুন পাসওয়ার্ড..." style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;">
        <button onclick="handleReset()" style="width:100%; padding:12px; background:#1a2a3a; color:white; border:none; border-radius:8px; cursor:pointer;">আপডেট করুন</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, verifyPasswordResetCode, confirmPasswordReset, applyActionCode } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", projectId: "ghotimarket" };
    const auth = getAuth(initializeApp(firebaseConfig));

    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode'); 
    const actionCode = urlParams.get('oobCode');

    if (!actionCode) showError("অ্যাকশন কোড খুঁজে পাওয়া যায়নি।");
    else if (mode === 'resetPassword') setupResetMode();
    else if (mode === 'verifyEmail' || mode === 'recoverEmail') handleStandardAction();
    else showError("অজানা রিকোয়েস্ট মোড।");

    async function setupResetMode() {
        try {
            await verifyPasswordResetCode(auth, actionCode);
            document.getElementById('title').innerText = "নতুন পাসওয়ার্ড সেট করুন";
            document.getElementById('reset-area').style.display = 'block';
        } catch (e) { showError("লিঙ্কটি মেয়াদোত্তীর্ণ বা ভুল।"); }
    }

    async function handleStandardAction() {
        try {
            await applyActionCode(auth, actionCode);
            if (mode === "verifyEmail") showSuccess("অভিনন্দন! আপনার ইমেইল সফলভাবে ভেরিফাই হয়েছে।");
            else showSuccess("আপনার ইমেইলটি সফলভাবে পরিবর্তন করা হয়েছে। এখন নতুন ইমেইল ব্যবহার করুন।");
        } catch (e) { showError("লিঙ্কটি সঠিক নয় বা এর মেয়াদ শেষ হয়ে গেছে।"); }
    }

    window.handleReset = async () => {
        const newPass = document.getElementById('new-password').value;
        if(newPass.length < 6) return alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।");
        try {
            await confirmPasswordReset(auth, actionCode, newPass);
            showSuccess("পাসওয়ার্ড সফলভাবে আপডেট হয়েছে!");
            document.getElementById('reset-area').style.display = 'none';
        } catch (e) { showError("পাসওয়ার্ড আপডেট ব্যর্থ হয়েছে।"); }
    };

    function showSuccess(msg) {
        document.getElementById('title').innerText = "সফল হয়েছে";
        const m = document.getElementById('message');
        const icon = document.getElementById('status-icon');
        icon.innerHTML = '<i class="fas fa-check-circle" style="color:#2ecc71"></i>';
        icon.style.display = "block";
        m.style.display = "block"; m.style.background = "#eafaf1"; m.style.color = "#2ecc71";
        m.innerText = msg;
    }

    function showError(msg) {
        document.getElementById('title').innerText = "ব্যর্থ হয়েছে";
        const m = document.getElementById('message');
        const icon = document.getElementById('status-icon');
        icon.innerHTML = '<i class="fas fa-times-circle" style="color:#e74c3c"></i>';
        icon.style.display = "block";
        m.style.display = "block"; m.style.background = "#fdedec"; m.style.color = "#e74c3c";
        m.innerText = msg;
    }
</script>
</body>
</html>
