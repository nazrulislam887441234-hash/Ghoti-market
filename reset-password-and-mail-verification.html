<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাকাউন্ট অ্যাকশন - ঘটি মার্কেট</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1a2a3a, #2c3e50);
            --success: #2ecc71;
            --accent: #3498db;
            --text-color: #2c3e50;
        }
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--primary-gradient);
            height: 100vh; margin: 0;
            display: flex; justify-content: center; align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.98);
            padding: 40px; border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            width: 100%; max-width: 400px;
            text-align: center; box-sizing: border-box;
        }
        .logo { width: 100px; height: 100px; margin-bottom: 15px; }
        h2 { color: var(--text-color); font-size: 24px; margin-bottom: 10px; }
        .user-email {
            background: #eef2f7; padding: 8px 15px;
            border-radius: 50px; display: inline-block;
            color: #555; font-weight: 600; font-size: 14px;
            margin-bottom: 20px; border: 1px solid #d1d9e6;
        }
        .status-icon { font-size: 50px; margin-bottom: 15px; display: none; }
        .input-group { margin-bottom: 20px; text-align: left; }
        input {
            width: 100%; padding: 14px; border: 2px solid #eee;
            border-radius: 12px; outline: none; font-size: 16px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 15px; background: var(--primary-gradient);
            color: white; border: none; border-radius: 12px;
            font-size: 18px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        #message {
            margin-top: 20px; padding: 15px; border-radius: 12px;
            display: none; font-weight: 600; font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://ghotimarketlogo.edgeone.app/background%20remove%20ghoti%20market.png" alt="Ghoti Market" class="logo">
        <h2 id="title">প্রসেসিং হচ্ছে...</h2>
        <div id="email-display" class="user-email" style="display:none;"></div>
        <p id="subtitle" style="color: #666; font-size: 14px; margin-bottom: 25px;"></p>

        <div id="reset-area" style="display:none;">
            <div class="input-group">
                <input type="password" id="new-password" placeholder="নতুন পাসওয়ার্ড দিন...">
            </div>
            <button onclick="handleReset()">পাসওয়ার্ড আপডেট করুন</button>
        </div>

        <div id="status-icon" class="status-icon"></div>
        <div id="message"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, verifyPasswordResetCode, confirmPasswordReset, applyActionCode } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", projectId: "ghotimarket" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode'); // verifyEmail অথবা resetPassword
        const actionCode = urlParams.get('oobCode');

        // ১. লোড হওয়ার সময় মোড চেক করা
        if (actionCode) {
            if (mode === 'resetPassword') {
                setupResetMode();
            } else if (mode === 'verifyEmail') {
                handleEmailVerification();
            } else {
                showError("অজানা রিকোয়েস্ট মোড।");
            }
        } else {
            showError("অ্যাকশন কোড খুঁজে পাওয়া যায়নি।");
        }

        // পাসওয়ার্ড রিসেট মোড সেটআপ
        async function setupResetMode() {
            try {
                const email = await verifyPasswordResetCode(auth, actionCode);
                document.getElementById('title').innerText = "পাসওয়ার্ড রিসেট";
                document.getElementById('subtitle').innerText = "আপনার অ্যাকাউন্টের জন্য নতুন পাসওয়ার্ড দিন।";
                document.getElementById('email-display').innerText = email;
                document.getElementById('email-display').style.display = 'inline-block';
                document.getElementById('reset-area').style.display = 'block';
            } catch (e) {
                showError("পাসওয়ার্ড রিসেট লিঙ্কটি মেয়াদোত্তীর্ণ।");
            }
        }

        // ইমেইল ভেরিফিকেশন হ্যান্ডেল করা
        async function handleEmailVerification() {
            document.getElementById('title').innerText = "ইমেইল ভেরিফিকেশন";
            try {
                await applyActionCode(auth, actionCode);
                showSuccess("আপনার ইমেইল সফলভাবে ভেরিফাই হয়েছে! এখন আপনি অ্যাপে ফিরে যেতে পারেন।");
            } catch (e) {
                showError("ইমেইল ভেরিফিকেশন লিঙ্কটি মেয়াদোত্তীর্ণ বা ভুল।");
            }
        }

        // পাসওয়ার্ড আপডেট ফাংশন
        window.handleReset = async () => {
            const newPass = document.getElementById('new-password').value;
            if(newPass.length < 6) return alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।");

            try {
                await confirmPasswordReset(auth, actionCode, newPass);
                document.getElementById('reset-area').style.display = 'none';
                showSuccess("পাসওয়ার্ড আপডেট হয়েছে! নতুন পাসওয়ার্ড দিয়ে লগইন করুন।");
            } catch (e) {
                showError("পাসওয়ার্ড রিসেট করা সম্ভব হয়নি।");
            }
        };

        function showSuccess(msgText) {
            const m = document.getElementById('message');
            const icon = document.getElementById('status-icon');
            icon.innerHTML = '<i class="fas fa-check-circle" style="color:var(--success)"></i>';
            icon.style.display = "block";
            m.style.display = "block";
            m.style.background = "#eafaf1";
            m.style.color = "#2ecc71";
            m.innerText = msgText;
            document.getElementById('subtitle').style.display = "none";
        }

        function showError(msgText) {
            const m = document.getElementById('message');
            const icon = document.getElementById('status-icon');
            icon.innerHTML = '<i class="fas fa-times-circle" style="color:#e74c3c"></i>';
            icon.style.display = "block";
            m.style.display = "block";
            m.style.background = "#fdedec";
            m.style.color = "#e74c3c";
            m.innerText = msgText;
            document.getElementById('title').innerText = "ব্যর্থ হয়েছে";
        }
    </script>
</body>
</html>
