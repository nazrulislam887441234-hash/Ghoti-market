<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>যাচাই করা হচ্ছে... | Ghoti Market</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #0f172a; }
        .loader { width: 50px; height: 50px; border: 5px solid #e2e8f0; border-top: 5px solid #f97316; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>অ্যাকাউন্ট ভেরিফাই করা হচ্ছে, কিছুক্ষণ অপেক্ষা করুন...</p>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "auth.ghotimarket.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);
    const redirectUrl = params.get('redirectUrl') || "https://ghotimarket.com";

    // Important: Wait for Auth to restore
    const unsubscribe = onAuthStateChanged(auth, (user) => {
        if (user) {
            // Once user is detected on this domain, proceed back to profile
            unsubscribe();
            window.location.replace(redirectUrl);
        } else {
            // Give it 2 seconds, if still no user, they might have cleared cookies
            setTimeout(() => {
                window.location.replace(redirectUrl);
            }, 2000);
        }
    });
</script>
</body>
</html>
