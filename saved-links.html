<!DOCTYPE html>
<html lang="bn">
<head>
    <title>রিডাইরেক্ট হচ্ছে...</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #f97316; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <div class="spinner"></div>
        <p>অপেক্ষা করুন...</p>
    </div>

    <script>
        window.onload = () => {
            const pending = localStorage.getItem('pendingRedirect');
            if (pending) {
                localStorage.removeItem('pendingRedirect');
                window.location.href = pending;
            } else {
                window.location.href = "https://ghotimarket.com";
            }
        };
    </script>
</body>
</html>
