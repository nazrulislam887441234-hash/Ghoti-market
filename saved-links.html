<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <script type="module">
        import { auth } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const lastPath = localStorage.getItem("ghoti_last_path");
                if (lastPath) {
                    localStorage.removeItem("ghoti_last_path");
                    // Append triggerReview to the original URL
                    const targetUrl = new URL(lastPath);
                    targetUrl.searchParams.set("triggerReview", "true");
                    window.location.href = targetUrl.href;
                } else {
                    window.location.href = "https://ghotimarket.com";
                }
            } else {
                window.location.href = "https://auth.ghotimarket.com";
            }
        });
    </script>
</body>
</html>
