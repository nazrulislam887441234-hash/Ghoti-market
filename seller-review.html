<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews | Ghoti Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background: #f8fafc; margin: 0; padding-bottom: 30px; }
        .header { background: #0f172a; color: white; padding: 15px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; }
        .back-btn { color: white; text-decoration: none; margin-right: 15px; }
        .review-card { background: white; margin: 15px; padding: 20px; border-radius: 20px; border: 1px solid #e2e8f0; }
        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .user-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #e2e8f0; }
        .user-name { font-weight: 700; font-size: 15px; }
        .rev-date { font-size: 11px; color: #94a3b8; }
        .stars { color: #f97316; font-size: 12px; margin-bottom: 8px; }
        .rev-title { font-weight: 800; font-size: 16px; margin-bottom: 5px; display: block; }
        .rev-msg { color: #475569; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="header">
        <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div style="font-weight:700;">কাস্টমার রিভিউ</div>
    </div>

    <div id="reviewsList">
        <div style="text-align:center; padding:50px; color:#94a3b8;">লোডিং রিভিউ...</div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { collection, query, where, getDocs, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const username = window.location.search.startsWith('?@') ? window.location.search.substring(2) : urlParams.get('username');

        async function loadReviews() {
            if (!username) return;

            // First get the seller ID
            const uQ = query(collection(db, "users"), where("username", "==", username), limit(1));
            const uSnap = await getDocs(uQ);
            if (uSnap.empty) return;
            const sellerId = uSnap.docs[0].id;

            const rQ = query(collection(db, "reviews"), where("sellerId", "==", sellerId), orderBy("createdAt", "desc"));
            
            onSnapshot(rQ, (snap) => {
                const list = document.getElementById('reviewsList');
                if (snap.empty) {
                    list.innerHTML = `<div style="text-align:center; padding:100px 20px; color:#94a3b8;">এখনো কোনো রিভিউ দেওয়া হয়নি।</div>`;
                    return;
                }

                list.innerHTML = snap.docs.map(doc => {
                    const r = doc.data();
                    let stars = "";
                    for(let i=1; i<=5; i++) stars += `<i class="${i <= r.rating ? 'fas' : 'far'} fa-star"></i> `;
                    
                    const date = r.createdAt ? new Date(r.createdAt.seconds * 1000).toLocaleDateString('bn-BD', {year:'numeric', month:'long', day:'numeric'}) : 'এইমাত্র';

                    return `
                        <div class="review-card">
                            <div class="user-info">
                                <img src="${r.userPhoto || 'https://i.ibb.co/6P0x9Yy/no-image.png'}" class="user-img">
                                <div>
                                    <div class="user-name">${r.userName}</div>
                                    <div class="rev-date">${date}</div>
                                </div>
                            </div>
                            <div class="stars">${stars}</div>
                            <strong class="rev-title">${r.title}</strong>
                            <div class="rev-msg">${r.message}</div>
                        </div>
                    `;
                }).join('');
            });
        }
        
        loadReviews();
    </script>
</body>
</html>
