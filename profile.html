<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Profile | Ghoti Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f0f2f5; }
        
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 20px;
        }

        .setup-box {
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .step-dot { width: 10px; height: 10px; background: #ddd; border-radius: 50%; }
        .step-dot.active { background: var(--accent); width: 30px; border-radius: 10px; }

        h2 { margin: 0 0 10px; color: var(--primary); font-size: 22px; text-align: center; }
        p.sub-title { text-align: center; color: #777; font-size: 14px; margin-bottom: 30px; }

        .input-field { position: relative; margin-bottom: 20px; }
        .input-field i { position: absolute; left: 15px; top: 14px; color: #aaa; font-size: 14px; }
        
        input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #e1e1e1;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background: #f9f9f9;
        }

        input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 8px rgba(52,152,219,0.1); }

        .save-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .save-btn:active { transform: scale(0.97); }
        .save-btn:disabled { background: #ccc; }

        .loader-spinner { display: none; margin-right: 8px; }
    </style>
</head>
<body>

<div class="setup-box">
    <div class="step-indicator">
        <div class="step-dot"></div>
        <div class="step-dot active"></div>
    </div>

    <h2>দোকানের তথ্য দিন</h2>
    <p class="sub-title">আপনার ব্যবসা শুরু করতে নিচের তথ্যগুলো সঠিক ভাবে পূরণ করুন</p>

    <div class="input-field">
        <i class="fas fa-store"></i>
        <input type="text" id="shop" placeholder="দোকানের নাম">
    </div>

    <div class="input-field">
        <i class="fas fa-user-tie"></i>
        <input type="text" id="owner" placeholder="আপনার পুরো নাম">
    </div>

    <div class="input-field">
        <i class="fas fa-map-marker-alt"></i>
        <input type="text" id="addr" placeholder="দোকানের ঠিকানা">
    </div>

    <div class="input-field">
        <i class="fab fa-whatsapp"></i>
        <input type="number" id="wa" placeholder="WhatsApp (কান্ট্রিকোড ছাড়া)">
    </div>

    <button onclick="save()" id="submitBtn" class="save-btn">
        <i class="fas fa-check-circle loader-spinner" id="icon"></i> সাইনআপ সম্পন্ন করুন
    </button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    
    const firebaseConfig = { 
        apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", 
        projectId: "ghotimarket",
        authDomain: "ghotimarket.firebaseapp.com"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.save = async () => {
        const shop = document.getElementById('shop').value.trim();
        const owner = document.getElementById('owner').value.trim();
        const addr = document.getElementById('addr').value.trim();
        const wa = document.getElementById('wa').value.trim();
        const btn = document.getElementById('submitBtn');

        if(!shop || !owner || !addr || !wa) {
            alert("সবগুলো ঘর সঠিক ভাবে পূরণ করুন!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "প্রসেসিং হচ্ছে...";

        try {
            const user = auth.currentUser;
            if(!user) throw new Error("User not found");

            await setDoc(doc(db, "users", user.uid), {
                shopName: shop,
                ownerName: owner,
                address: addr,
                whatsapp: wa,
                email: user.email,
                verified: false,
                profileUnlockedUntil: 0,
                createdAt: Date.now()
            });

            window.location.href = "verification-notice.html";
        } catch (err) {
            alert("তথ্য সেভ করতে সমস্যা হয়েছে! আবার চেষ্টা করুন।");
            btn.disabled = false;
            btn.innerText = "সাইনআপ সম্পন্ন করুন";
        }
    }
</script>

</body>
</html>
