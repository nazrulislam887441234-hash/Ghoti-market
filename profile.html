@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&display=swap');
:root {

<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
          getFirestore,
          doc,
          getDoc,
          collection,
          query,
          where,
          getDocs,
          limit
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
          authDomain: "ghotimarket.firebaseapp.com",
          databaseURL: "https://ghotimarket-default-rtdb.firebaseio.com",
          projectId: "ghotimarket",
          storageBucket: "ghotimarket.firebasestorage.app",
          messagingSenderId: "481257644093",
          appId: "1:481257644093:web:0dfc3699d6b3c86afeca54",
          measurementId: "G-4SR8V2EKC1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const FALLBACK_LOGO = "https://i.ibb.co/RG2hrf3y/background-remove-ghoti-market.png";

        function updateFavicons(shopLogo) {
            let validLogo = (shopLogo && typeof shopLogo === 'string' && shopLogo.trim() !== "") 
                ? shopLogo.trim() 
                : FALLBACK_LOGO;

            const timestamp = Date.now();
            const versionedLogo = `${validLogo}${validLogo.includes('?') ? '&' : '?'}v=${timestamp}`;

            function setOrCreateElement(selector, attributes) {
                let el = document.querySelector(selector);
                if (!el) {
                    const parts = selector.split('[');
                    const tagName = parts[0];
                    el = document.createElement(tagName);
                    document.head.appendChild(el);
                }
                for (const [key, value] of Object.entries(attributes)) {
                    el.setAttribute(key, value);
                }
            }

            setOrCreateElement("link[rel='icon']", { rel: "icon", type: "image/png", href: versionedLogo });
            setOrCreateElement("link[rel='shortcut icon']", { rel: "shortcut icon", type: "image/png", href: versionedLogo });
            setOrCreateElement("link[rel='apple-touch-icon']", { rel: "apple-touch-icon", href: versionedLogo });
            setOrCreateElement("link[rel='mask-icon']", { rel: "mask-icon", href: versionedLogo, color: "#f97316" });
            setOrCreateElement("meta[property='og:image']", { property: "og:image", content: versionedLogo });
            setOrCreateElement("meta[name='twitter:image']", { name: "twitter:image", content: versionedLogo });

            const jsonLdScript = document.getElementById("jsonLdData");
            if (jsonLdScript) {
                try {
                    let schemaData = JSON.parse(jsonLdScript.textContent);
                    schemaData.logo = versionedLogo;
                    schemaData.image = versionedLogo;
                    jsonLdScript.textContent = JSON.stringify(schemaData, null, 2);
                } catch (e) {
                    console.error("JSON-LD Favicon Update Error:", e);
                }
            }
        }

        function setMetaTag(selector, attr, value) {
            let el = document.querySelector(selector);
            if (el) el.setAttribute(attr, value);
        }

        function setPropertyMeta(property, value) {
            let el = document.querySelector(`meta[property="${property}"]`);
            if (el) el.setAttribute("content", value);
        }

        function renderDescription(shopDescription) {
            const container = document.getElementById("shopDescriptionContainer");
            const textEl = document.getElementById("shopDescriptionText");
            if (shopDescription && shopDescription.trim() !== "") {
                textEl.textContent = shopDescription;
                container.style.display = "block";
            } else {
                container.style.display = "none";
            }
        }

        function updateSEO(shopData) {
            const shopName = shopData.shopName || "Shop";
            const shopDescriptionRaw = shopData.shopDescription || "";
            const shopLogo = shopData.shopLogo || FALLBACK_LOGO;
            const shopBanner = shopData.shopBanner || shopLogo;
            const currentUrl = window.location.href;

            let metaDesc = shopDescriptionRaw.trim() !== "" ? shopDescriptionRaw.trim() : `Browse products from ${shopName} on Ghoti Market.`;
            if (metaDesc.length > 160) metaDesc = metaDesc.substring(0, 157) + "...";
            setMetaTag("#metaDescription", "content", metaDesc);

            let keywordsStr = shopName;
            if (Array.isArray(shopData.shopKeywords) && shopData.shopKeywords.length > 0) {
                keywordsStr = shopData.shopKeywords.join(", ");
            }
            setMetaTag("#metaKeywords", "content", keywordsStr);

            setPropertyMeta("og:title", `${shopName} | Ghoti Market`);
            setPropertyMeta("og:description", metaDesc);
            setPropertyMeta("og:image", shopBanner);
            setPropertyMeta("og:type", "website");
            setPropertyMeta("og:url", currentUrl);

            setMetaTag("meta[name='twitter:title']", "content", `${shopName} | Ghoti Market`);
            setMetaTag("meta[name='twitter:description']", "content", metaDesc);
            setMetaTag("meta[name='twitter:image']", "content", shopBanner);
            setMetaTag("meta[name='twitter:card']", "content", "summary_large_image");

            document.getElementById("metaTitle").innerText = `${shopName} | Ghoti Market`;
            document.title = `${shopName} | Ghoti Market`;

            const jsonLdScript = document.getElementById("jsonLdData");
            if (jsonLdScript) {
                const schemaData = {
                    "@context": "https://schema.org",
                    "@type": "LocalBusiness",
                    "name": shopName,
                    "description": metaDesc,
                    "image": shopBanner,
                    "url": currentUrl,
                    "logo": shopLogo
                };
                if (shopData.sameAs) schemaData.sameAs = shopData.sameAs;
                jsonLdScript.textContent = JSON.stringify(schemaData, null, 2);
            }
        }

        function parseTargetFromURL() {
            try {
                const search = window.location.search;
                const urlParams = new URLSearchParams(search);

                let usernameVal = urlParams.get("username");
                if (usernameVal && usernameVal.trim() !== "") {
                    let cleanU = decodeURIComponent(usernameVal.trim());
                    if (cleanU.startsWith('@')) cleanU = cleanU.substring(1);
                    return { type: "explicit_username", value: cleanU };
                }

                let atVal = urlParams.get("@");
                if (atVal && atVal.trim() !== "") {
                    let cleanU = decodeURIComponent(atVal.trim());
                    if (cleanU.startsWith('@')) cleanU = cleanU.substring(1);
                    return { type: "explicit_at", value: cleanU };
                }

                for (const [key, value] of urlParams.entries()) {
                    let cleanKey = decodeURIComponent(key.trim());
                    if (cleanKey && cleanKey !== 'fbclid' && cleanKey !== 'gclid' && !cleanKey.startsWith('utm_') && cleanKey !== 'sellerId') {
                        if (cleanKey.startsWith('@')) return { type: "encoded_at", value: cleanKey.substring(1) };
                        if (value === '' && !cleanKey.includes('=')) return { type: "raw_param", value: cleanKey.replace(/^@/, '') };
                    }
                }

                if (search && search.length > 1) {
                    const raw = decodeURIComponent(search.substring(1).split('&')[0].trim());
                    if (raw && !raw.includes('=') && !raw.startsWith('fbclid') && !raw.startsWith('gclid') && !raw.startsWith('utm_')) {
                        let cleanRaw = raw.startsWith('@') ? raw.substring(1) : raw;
                        return { type: "raw_value", value: cleanRaw };
                    }
                }

                if (window.location.hash) {
                    let hashVal = decodeURIComponent(window.location.hash.substring(1).trim());
                    if (hashVal) {
                        if (hashVal.startsWith('@')) hashVal = hashVal.substring(1);
                        return { type: "hash_value", value: hashVal };
                    }
                }

                return { type: null, value: null };
            } catch (err) {
                console.error("URL Parsing Error:", err);
                return { type: null, value: null };
            }
        }

        let allProducts = [];
        let filteredProducts = [];
        let displayCount = 100;

        // ===== ROBUST SELLER LOOKUP SYSTEM =====
        async function fetchSellerProfile(targetVal) {
            if (!targetVal || !targetVal.trim()) return null;
            const cleanTarget = decodeURIComponent(targetVal.trim());
            const cleanLower = cleanTarget.toLowerCase();

            // Priority 1: Check public_sellers collection by Document ID
            console.log(`[Priority 1] Checking 'public_sellers' document ID: ${cleanTarget}`);
            try {
                const pubDocRef = doc(db, "public_sellers", cleanTarget);
                const pubSnap = await getDoc(pubDocRef);
                if (pubSnap.exists()) {
                    console.log("[Priority 1 Success] Found in public_sellers by Doc ID:", pubSnap.id);
                    return { docId: pubSnap.id, data: pubSnap.data() };
                }
            } catch (err) {
                console.warn("[Priority 1 Failed]", err.message);
            }

            // Priority 2: Check users collection by Document ID (Fallback)
            console.log(`[Priority 2] Checking 'users' document ID: ${cleanTarget}`);
            try {
                const userDocRef = doc(db, "users", cleanTarget);
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    console.log("[Priority 2 Success] Found in users by Doc ID:", userSnap.id);
                    return { docId: userSnap.id, data: userSnap.data() };
                }
            } catch (err) {
                console.warn("[Priority 2 Failed]", err.message);
            }

            // Priority 3: Check users collection by uid field query
            console.log(`[Priority 3] Querying 'users' where uid == ${cleanTarget}`);
            try {
                const uidQuery = query(collection(db, "users"), where("uid", "==", cleanTarget), limit(1));
                const uidSnap = await getDocs(uidQuery);
                if (!uidSnap.empty) {
                    const docObj = uidSnap.docs[0];
                    console.log("[Priority 3 Success] Found in users via uid field query:", docObj.id);
                    return { docId: docObj.id, data: docObj.data() };
                }
            } catch (err) {
                console.warn("[Priority 3 Failed] UID field lookup failed:", err.message);
            }

            // Priority 4: Username lookup (public_sellers -> users)
            console.log(`[Priority 4] Querying username == ${cleanLower}`);
            try {
                // 4a. Check public_sellers by usernameLower
                let pubQ = query(collection(db, "public_sellers"), where("usernameLower", "==", cleanLower), limit(1));
                let pubSnap = await getDocs(pubQ);
                if (!pubSnap.empty) {
                    console.log("[Priority 4a Success] Found in public_sellers by usernameLower:", pubSnap.docs[0].id);
                    return { docId: pubSnap.docs[0].id, data: pubSnap.docs[0].data() };
                }

                // 4b. Check public_sellers by username
                pubQ = query(collection(db, "public_sellers"), where("username", "==", cleanTarget), limit(1));
                pubSnap = await getDocs(pubQ);
                if (!pubSnap.empty) {
                    console.log("[Priority 4b Success] Found in public_sellers by username:", pubSnap.docs[0].id);
                    return { docId: pubSnap.docs[0].id, data: pubSnap.docs[0].data() };
                }

                // 4c. Check users by usernameLower
                let userQ = query(collection(db, "users"), where("usernameLower", "==", cleanLower), limit(1));
                let userSnap = await getDocs(userQ);
                if (!userSnap.empty) {
                    console.log("[Priority 4c Success] Found in users by usernameLower:", userSnap.docs[0].id);
                    return { docId: userSnap.docs[0].id, data: userSnap.docs[0].data() };
                }

                // 4d. Check users by username
                userQ = query(collection(db, "users"), where("username", "==", cleanTarget), limit(1));
                userSnap = await getDocs(userQ);
                if (!userSnap.empty) {
                    console.log("[Priority 4d Success] Found in users by username:", userSnap.docs[0].id);
                    return { docId: userSnap.docs[0].id, data: userSnap.docs[0].data() };
                }
            } catch (err) {
                console.warn("[Priority 4 Failed] Username lookup failed:", err.message);
            }

            return null;
        }

        async function loadProfile() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const explicitSellerId = urlParams.get("sellerId");
                
                let targetIdentifier = null;
                if (explicitSellerId && explicitSellerId.trim() !== "") {
                    targetIdentifier = decodeURIComponent(explicitSellerId.trim());
                } else {
                    const parsed = parseTargetFromURL();
                    if (parsed && parsed.value) targetIdentifier = parsed.value;
                }

                console.log("Seller lookup target identifier:", targetIdentifier);

                if (!targetIdentifier) {
                    console.error("User document not found: No valid seller ID or username in URL");
                    document.getElementById("shopName").innerText = "Shop Not Found";
                    updateFavicons(null);
                    return;
                }

                const sellerResult = await fetchSellerProfile(targetIdentifier);

                if (!sellerResult || !sellerResult.data) {
                    console.error("User document not found across all lookup priorities.");
                    document.getElementById("shopName").innerText = "Shop Not Found";
                    updateFavicons(null);
                    return;
                }

                const actualDocumentId = sellerResult.docId;
                const d = sellerResult.data;

                // Priority for Seller UID: d.uid takes priority, fallback to actualDocumentId
                const actualSellerUid = d.uid || actualDocumentId;
                console.log(`Seller Verified. Document ID: ${actualDocumentId} | Firebase Auth UID: ${actualSellerUid}`);

                document.getElementById('shopName').innerText = d.shopName || "Unknown Shop";

                if (d.shopLogo) {
                    document.getElementById('shopLogoImg').src = d.shopLogo;
                } else {
                    document.getElementById('shopLogoImg').src = FALLBACK_LOGO;
                }

                if (d.shopBanner) {
                    document.getElementById('shopBannerImg').src = d.shopBanner;
                    document.getElementById('shopBannerImg').style.display = "block";
                }

                if (d.verified) {
                    document.getElementById('verifiedBadge').style.display = "flex";
                } else {
                    document.getElementById('verifiedBadge').style.display = "none";
                }

                renderDescription(d.shopDescription);
                updateSEO(d);
                updateFavicons(d.shopLogo);

                // ===== PRODUCT QUERY USING ACTUAL SELLER AUTH UID =====
                console.log("Querying products for sellerId (Firebase Auth UID):", actualSellerUid);
                try {
                    const productQuery = query(
                        collection(db, "products"),
                        where("sellerId", "==", actualSellerUid),
                        where("active", "==", true)
                    );

                    const productSnap = await getDocs(productQuery);

                    allProducts = productSnap.docs.map(productDoc => ({
                        id: productDoc.id,
                        ...productDoc.data()
                    }));

                    console.log(`Product Query Success: Found ${allProducts.length} active products.`);

                    filteredProducts = allProducts;
                    render();
                } catch (prodErr) {
                    console.error("Product query failed:", prodErr);
                    if (prodErr.code === 'permission-denied') {
                        console.error("Permission denied on products query");
                    }
                    const grid = document.getElementById('sellerProductGrid');
                    grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; padding:40px; color:#ef4444;">ডাটা লোড করতে সমস্যা হয়েছে</p>';
                }

            } catch (error) {
                console.error("Profile Load Error:", error);
                if (error.code === 'permission-denied') {
                    console.error("Permission denied: Seller profile access denied");
                    document.getElementById("shopName").innerText = "Seller profile access denied";
                } else {
                    document.getElementById("shopName").innerText = "ডাটা লোড করতে সমস্যা হয়েছে";
                }
                updateFavicons(null);
            }
        }

        window.handleSearch = () => {
            const term = document.getElementById('pSearch').value.toLowerCase().trim();
            filteredProducts = allProducts.filter(p =>
                p.name?.toLowerCase().includes(term) ||
                (Array.isArray(p.keywords) ? p.keywords.some(k => k.toLowerCase().includes(term)) : p.keywords?.toLowerCase().includes(term))
            );
            displayCount = 100;
            render();
        };

        window.loadMore = () => {
            displayCount += 100;
            render();
        };

        function render() {
            const grid = document.getElementById('sellerProductGrid');
            const btn = document.getElementById('seeMoreBtn');
            const dataToDisplay = filteredProducts.slice(0, displayCount);

            grid.innerHTML = dataToDisplay.length ? dataToDisplay.map(p => `
              <a href="${
                p.slug
                   ? `https://ghotimarket.com/product?${p.slug}`
                    : `https://ghotimarket.com/product?id=${p.id}`
            }" class="p-card">
                    <div class="img-box"><img src="${p.images?.[0] || ''}" alt="${p.name || ''}"></div>
                    <div class="p-info">
                        <div class="p-name">${p.name || ''}</div>
                      <div class="price-box">
                        <span class="current-price">৳${p.price || 0}</span>

                        ${
                            p.oldPrice && Number(p.oldPrice) > Number(p.price)
                           ? `
                            <span class="old-price">৳${p.oldPrice}</span>

                            <span class="discount-badge">
                                ${Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100)}% OFF
                            </span>

                            <div class="save-text">
                                Save ৳${p.oldPrice - p.price}
                            </div>
                            `
                            : ""
                        }
                    </div>

                    </div>
                </a>
            `).join('') : '<p style="text-align:center; grid-column:1/-1; padding:40px;">এই দোকানে বর্তমানে কোনো পণ্য নেই</p>';

            btn.style.display = (displayCount < filteredProducts.length) ? 'block' : 'none';
        }

        loadProfile();
    </script>
<script>
  lucide.createIcons();
</script>
</body>
</html>
