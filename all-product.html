    <style>
        :root {
            --orange: #FF6A00;
            --orange-light: #FFF4EC;
            --orange-dark: #E55F00;
            --white: #FFFFFF;
            --text: #1A1A1A;
            --text-light: #666666;
            --border: rgba(255, 106, 0, 0.15);
            --shadow: 0 10px 30px rgba(255, 106, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #FFF4EC 0%, #FFF9F5 50%, #FFFFFF 100%);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Sticky Header */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
            color: var(--orange);
            text-decoration: none;
        }

        /* Search Bar - Optimized to be fully responsive, wider across all screen sizes */
        .search-container {
            flex: 1;
            width: 100%;
            max-width: 700px;
            position: relative;
        }

        .search-container i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 16px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 48px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 50px;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: var(--transition);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .search-input:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(255, 106, 0, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
            background: var(--white);
        }

        /* Main Container */
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }

        .section-title i {
            color: var(--orange);
        }

        /* Responsive Grid: Mobile 2, Tablet 3, Desktop 5 */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media(min-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        @media(min-width: 1024px) {
            .products-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 20px;
            }
        }

        /* Product Card Design */
        .product-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: var(--text);
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 106, 0, 0.15);
            border-color: rgba(255, 106, 0, 0.3);
        }

        /* Image Box & Badges */
        .product-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Aspect Ratio */
            background: var(--orange-light);
            overflow: hidden;
        }

        .product-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.08);
        }

        .category-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            color: var(--orange);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid var(--border);
            z-index: 2;
        }

        .discount-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%);
            color: #FFFFFF;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            z-index: 2;
            box-shadow: 0 4px 10px rgba(255, 65, 108, 0.3);
        }

        /* Product Body */
        .product-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            justify-content: space-between;
        }

        .shop-name {
            font-size: 11px;
            color: var(--text-light);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;

        .shop-name i {
            color: var(--orange);
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .current-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--orange);
        }

        .old-price {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-light);
            text-decoration: line-through;
        }

        /* Load More Button Area */
        .load-more-container {
            text-align: center;
            margin-top: 40px;
        }

        .btn-load-more {
            background: linear-gradient(135deg, var(--orange) 0%, #FF8533 100%);
            color: var(--white);
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 106, 0, 0.3);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-load-more:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 106, 0, 0.4);
        }

        .btn-load-more:active {
            transform: translateY(0);
        }

        .btn-load-more:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* End Message & Loading States */
        .end-message {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            padding: 15px;
            background: rgba(255,255,255,0.5);
            border-radius: 12px;
            border: 1px solid var(--border);
            display: none;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: rgba(255,255,255,0.7);
            border-radius: 20px;
            border: 1px dashed var(--border);
        }

        .empty-icon {
            font-size: 50px;
            color: var(--orange);
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 5px;
        }

        .empty-desc {
            font-size: 13px;
            color: var(--text-light);
        }

        /* Skeleton Loaders */
        .skeleton-card {
            background: rgba(255,255,255,0.8);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .skeleton-img {
            width: 100%;
            padding-top: 100%;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .skeleton-line {
            height: 12px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        /* --- Bottom Nav FIXED --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--glass-border); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-sub); font-size: 10px; font-weight: 800; transition: 0.3s; flex: 1; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); }
    </style>
</head>

            <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-content"><div class="skeleton-line" style="width: 60%;"></div><div class="skeleton-line" style="width: 90%;"></div><div class="skeleton-line" style="width: 40%;"></div></div></div>
            <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-content"><div class="skeleton-line" style="width: 60%;"></div><div class="skeleton-line" style="width: 90%;"></div><div class="skeleton-line" style="width: 40%;"></div></div></div>

    <!-- Application Script -->
    <script type="module">
        import { db } from "./firebase.js";
        import {
          collection,
          getDocs,
          query,
          where
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        let allProducts = [];          // Fetched & randomized active products
        let displayedCount = 0;        // Currently rendered count
        const BATCH_SIZE = 50;         // 50 items per batch
        let isSearching = false;
        let filteredProducts = [];

        const productsGrid = document.getElementById('productsGrid');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const endMessage = document.getElementById('endMessage');
        const searchInput = document.getElementById('searchInput');

        // Optimized Data Fetching: Fetches active products directly without unnecessary user lookup mapping
        async function fetchProducts() {
            try {
                // Fetch active products query directly
                const q = query(collection(db, "products"), where("active", "==", true));
                const querySnapshot = await getDocs(q);
                
                let rawList = [];
                querySnapshot.forEach((docSnap) => {
                    const productData = docSnap.data();
                    const productId = docSnap.id;

                    const product = {
                        id: productId,
                        ...productData
                    };
                    rawList.push(product);
                });

                // Randomize entire list to fulfill pure random mixing requirement
                allProducts = shuffleArray(rawList);
                
                // Clear initial skeletons
                productsGrid.innerHTML = '';
                
                if (allProducts.length === 0) {
                    renderEmptyState();
                    return;
                }

                // Render first 50 items progressively
                renderNextBatch();

            } catch (error) {
                console.error("Error fetching products:", error);
                productsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <div class="empty-title">ডাটা লোড করতে সমস্যা হয়েছে</div>
                        <div class="empty-desc">দয়া করে আপনার ইন্টারনেট কানেকশন চেক করুন।</div>
                    </div>
                `;
            }
        }

        // Fisher-Yates Shuffle Algorithm for true random order
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Progressive Rendering of the next batch using DocumentFragment and requestAnimationFrame
        function renderNextBatch() {
            const dataSource = isSearching ? filteredProducts : allProducts;
            const remaining = dataSource.length - displayedCount;
            const countToRender = Math.min(BATCH_SIZE, remaining);

            if (countToRender <= 0) {
                loadMoreContainer.style.display = 'none';
                if (dataSource.length > 0) {
                    endMessage.style.display = 'block';
                }
                return;
            }

            const fragment = document.createDocumentFragment();
            const nextItems = dataSource.slice(displayedCount, displayedCount + countToRender);

            nextItems.forEach(product => {
                const card = createProductCard(product);
                fragment.appendChild(card);
            });

            // Use requestAnimationFrame for smooth non-blocking UI rendering
            requestAnimationFrame(() => {
                productsGrid.appendChild(fragment);
            });

            displayedCount += countToRender;

            // Toggle Load More visibility
            if (displayedCount < dataSource.length) {
                loadMoreContainer.style.display = 'block';
                endMessage.style.display = 'none';
            } else {
                loadMoreContainer.style.display = 'none';
                endMessage.style.display = 'block';
            }
        }

        // Construct Individual Product Card Element
        function createProductCard(product) {
            const card = document.createElement('a');
            card.href = `https://www.ghotimarket.com/product.html?${product.slug || ''}`;
            card.className = 'product-card';

            const price = Number(product.price) || 0;
            const oldPrice = Number(product.oldPrice) || 0;
            
            // Calculate discount percentage
            let discountHtml = '';
            if (oldPrice > price && oldPrice > 0) {
                const discount = Math.round(((oldPrice - price) / oldPrice) * 100);
                if (discount > 0) {
                    discountHtml = `<div class="discount-badge">${discount}% OFF</div>`;
                }
            }

            const thumbnail = (product.images && product.images.length > 0) ? product.images[0] : '';
            const categoryName = product.categoryName || 'General';
            const shopName = product.shopName || 'GHOTI Seller';
            const productName = product.name || 'Unnamed Product';

            card.innerHTML = `
                <div class="product-img-wrapper">
                    <span class="category-badge">${escapeHtml(categoryName)}</span>
                    ${discountHtml}
                    <img src="${escapeHtml(thumbnail)}" alt="${escapeHtml(productName)}" class="product-img" loading="lazy" onerror="this.src='https://via.placeholder.com/300?text=GHOTI+MARKET'">
                </div>
                <div class="product-info">
                    <div>
                        <div class="shop-name">
                            <i class="fa-solid fa-store"></i>
                            ${escapeHtml(shopName)}
                        </div>
                        <div class="product-name">${escapeHtml(productName)}</div>
                    </div>
                    <div class="price-box">
                        <span class="current-price">৳${price}</span>
                        ${oldPrice > price ? `<span class="old-price">৳${oldPrice}</span>` : ''}
                    </div>
                </div>
            `;

            return card;
        }

        // HTML Escape utility to prevent XSS
        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Render Empty State
        function renderEmptyState() {
            productsGrid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fa-solid fa-face-frown"></i></div>
                    <div class="empty-title">No Products Found</div>
                    <div class="empty-desc">আপনার অনুসন্ধানের সাথে মিলে এমন কোনো পণ্য পাওয়া যায়নি। অন্য কিছু দিয়ে সার্চ করুন।</div>
                </div>
            `;
            loadMoreContainer.style.display = 'none';
            endMessage.style.display = 'none';
        }

        // Real-Time Debounced Search Logic
        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const term = e.target.value.toLowerCase().trim();
                
                if (term === "") {
                    isSearching = false;
                    filteredProducts = [];
                    displayedCount = 0;
                    productsGrid.innerHTML = '';
                    renderNextBatch();
                    return;
                }

                isSearching = true;
                filteredProducts = allProducts.filter(item => {
                    const nameMatch = (item.name || "").toLowerCase().includes(term);
                    const descMatch = (item.description || "").toLowerCase().includes(term);
                    const catMatch = (item.categoryName || "").toLowerCase().includes(term);
                    const shopMatch = (item.shopName || "").toLowerCase().includes(term);
                    
                    let keywordMatch = false;
                    if (Array.isArray(item.keywords)) {
                        keywordMatch = item.keywords.some(kw => String(kw).toLowerCase().includes(term));
                    }

                    return nameMatch || descMatch || catMatch || shopMatch || keywordMatch;
                });

                displayedCount = 0;
                productsGrid.innerHTML = '';

                if (filteredProducts.length === 0) {
                    renderEmptyState();
                } else {
                    renderNextBatch();
                }
            }, 300); // 300ms Debounce
        });

        // Load More Button Event Listener
        loadMoreBtn.addEventListener('click', () => {
            renderNextBatch();
        });

        // Trigger initial data load on page startup
        window.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
