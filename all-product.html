<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সকল পণ্য - GHOTI MARKET | Professional Marketplace</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/RG2hrf3y/background-remove-ghoti-market.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/RG2hrf3y/background-remove-ghoti-market.png">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="GHOTI MARKET-এর সমস্ত সেরা পণ্যগুলো ব্রাউজ করুন। ক্যাশ অন ডেলিভারি এবং আকর্ষণীয় ডিসকাউন্টে সেরা শপিং অভিজ্ঞতা।">
    <link rel="canonical" href="https://www.ghotimarket.com/products.html">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

     <link rel="stylesheet" href="all-product.css">
</head>
<body>

    <!-- Sticky Header -->
    <header>
        <div class="header-container">
            <a href="https://www.ghotimarket.com/" class="brand">
                <i class="fa-solid fa-store"></i>
                <span>GHOTI MARKET</span>
            </a>
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="পণ্য, ক্যাটাগরি বা শপ খুঁজুন...">
            </div>
            <a href="cart.html" class="cart-icon-btn" title="শপিং কার্ট">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <h1 class="section-title"><i class="fa-solid fa-box-open"></i> সকল পণ্য</h1>
        
        <div class="products-grid" id="productsGrid">
            <!-- Initial Skeleton Loaders -->
            <div class="skeleton-card" style="grid-column: 1/-1; text-align:center; padding:30px; color:#666;">পণ্য লোড হচ্ছে...</div>
        </div>

        <div class="load-more-container" id="loadMoreContainer" style="display: none;">
            <button class="btn-load-more" id="loadMoreBtn">
                <i class="fa-solid fa-circle-plus"></i> আরো দেখুন
            </button>
        </div>

        <div class="end-message" id="endMessage">
            সব পণ্য দেখানো হয়েছে
        </div>
    </div>

    <!-- Variant Selection Modal -->
    <div class="variant-modal-overlay" id="variantModalOverlay" style="display: none;">
        <div class="variant-modal">
            <div class="variant-modal-header">
                <h3>ভ্যারিয়েন্ট সিলেক্ট করুন</h3>
                <button class="modal-close-btn" id="closeVariantModal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="variant-modal-body" id="variantModalBody"></div>
            <div class="variant-modal-footer">
                <button class="btn-modal-confirm" id="confirmVariantBtn">কনফার্ম করুন</button>
            </div>
        </div>
    </div>
   <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="https://ghotimarket.com" class="nav-item"><i data-lucide="home"></i><span>Home</span></a>
        <a href="https://ghotimarket.com/categories" class="nav-item"><i data-lucide="grid"></i><span>Categories</span></a>
        <a href="https://ghotimarket.com/all-product" class="nav-item active"><i data-lucide="box"></i><span>products</span></a>
        <a href="https://ghotimarket.com/contact" class="nav-item"><i data-lucide="headphones"></i><span>Support</span></a>
        <a href="https://ghotimarket.com/privacy-policy" class="nav-item"><i data-lucide="shield-check"></i><span>Privacy</span></a>
        <a href="profile.html" class="nav-item">
            <i data-lucide="circle-user-round"></i>
            <span>Profile</span>
        </a> 
        <a href="https://seller.ghotimarket.com/signup" class="nav-item"><i data-lucide="store"></i><span>J.Seller</span></a>
    </nav>

    <!-- Application Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
          collection,
          getDocs,
          query,
          where,
          limit,
          startAfter,
          orderBy,
          documentId,
          addDoc,
          updateDoc,
          doc,
          serverTimestamp,
          getFirestore
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
            authDomain: "ghotimarket.firebaseapp.com",
            databaseURL: "https://ghotimarket-default-rtdb.firebaseio.com",
            projectId: "ghotimarket",
            storageBucket: "ghotimarket.firebasestorage.app",
            messagingSenderId: "481257644093",
            appId: "1:481257644093:web:0dfc3699d6b3c86afeca54",
            measurementId: "G-4SR8V2EKC1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let userCartItems = [];

        let allProducts = [];          
        let lastVisible = null;
        const BATCH_SIZE = 50; 
        let isSearching = false;
        let filteredProducts = [];
        let hasMoreProducts = true;

        let activeVariantProduct = null;
        let activeIsBuyNow = false;
        let selectedVariantSelections = {};
        let selectedVariantDetails = {};

        const productsGrid = document.getElementById('productsGrid');
        const loadMoreContainer = document.getElementById('loadMoreContainer');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const endMessage = document.getElementById('endMessage');
        const searchInput = document.getElementById('searchInput');

        const variantModalOverlay = document.getElementById('variantModalOverlay');
        const closeVariantModalBtn = document.getElementById('closeVariantModal');
        const variantModalBody = document.getElementById('variantModalBody');
        const confirmVariantBtn = document.getElementById('confirmVariantBtn');

        // Custom Toast Notification Function
        function showToast(message, type = 'success') {
            let toast = document.getElementById('ghotiToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'ghotiToast';
                toast.className = 'ghoti-toast';
                document.body.appendChild(toast);
            }
            toast.innerHTML = type === 'success' ? `<i class="fa-solid fa-circle-check"></i> ${message}` : `<i class="fa-solid fa-circle-exclamation"></i> ${message}`;
            toast.className = `ghoti-toast ${type} show`;
            
            clearTimeout(toast.timer);
            toast.timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Fetch User Cart from Firestore
        async function fetchUserCart() {
            if (!currentUser) return;
            try {
                const q = query(collection(db, "carts"), where("uid", "==", currentUser.uid));
                const querySnapshot = await getDocs(q);
                userCartItems = [];
                querySnapshot.forEach((docSnap) => {
                    userCartItems.push({ cartDocId: docSnap.id, ...docSnap.data() });
                });
                updateCartBadge();
                updateAllCardCartStates();
            } catch (err) {
                console.error("Error fetching cart from Firestore:", err);
            }
        }

        function updateCartBadge() {
            try {
                const totalCount = userCartItems.reduce((sum, item) => sum + (item.quantity || 1), 0);
                const badge = document.getElementById('cartBadge');
                if (badge) {
                    badge.textContent = totalCount;
                    badge.style.display = totalCount > 0 ? 'inline-block' : 'none';
                }
            } catch (err) {
                console.error("Cart badge update error:", err);
            }
        }

        async function fetchProducts(isLoadMore = false) {
            try {
                if (!isLoadMore) {
                    productsGrid.innerHTML = '';
                    lastVisible = null;
                    hasMoreProducts = true;
                    allProducts = [];
                }

                if (!hasMoreProducts && isLoadMore) return;

                let q;
                if (!isLoadMore || !lastVisible) {
                    q = query(
                        collection(db, "products"),
                        where("active", "==", true),
                        orderBy(documentId(), "desc"),
                        limit(BATCH_SIZE)
                    );
                } else {
                    q = query(
                        collection(db, "products"),
                        where("active", "==", true),
                        orderBy(documentId(), "desc"),
                        startAfter(lastVisible),
                        limit(BATCH_SIZE)
                    );
                }

                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    hasMoreProducts = false;
                    loadMoreContainer.style.display = 'none';
                    if (allProducts.length > 0) {
                        endMessage.style.display = 'block';
                    } else {
                        renderEmptyState();
                    }
                    return;
                }

                lastVisible = querySnapshot.docs[querySnapshot.docs.length - 1];

                let fetchedList = [];
                querySnapshot.forEach((docSnap) => {
                    fetchedList.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (querySnapshot.docs.length < BATCH_SIZE) {
                    hasMoreProducts = false;
                }

                allProducts = allProducts.concat(fetchedList);

                if (!isLoadMore) {
                    productsGrid.innerHTML = '';
                }

                if (allProducts.length === 0) {
                    renderEmptyState();
                    return;
                }

                renderBatch(fetchedList);

            } catch (error) {
                console.error("Error fetching products:", error);
                productsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-title">ডাটা লোড করতে সমস্যা হয়েছে</div>
                        <div class="empty-desc">দয়া করে আপনার ইন্টারনেট কানেকশন চেক করুন।</div>
                    </div>
                `;
            }
        }

        function renderBatch(itemsToRender) {
            const dataSource = isSearching ? filteredProducts : itemsToRender;
            
            if (dataSource.length === 0 && !isSearching) {
                loadMoreContainer.style.display = 'none';
                if (allProducts.length > 0) {
                    endMessage.style.display = 'block';
                }
                return;
            }

            const fragment = document.createDocumentFragment();
            dataSource.forEach(product => {
                const card = createProductCard(product);
                fragment.appendChild(card);
            });

            productsGrid.appendChild(fragment);

            if (isSearching) {
                loadMoreContainer.style.display = 'none';
                endMessage.style.display = 'block';
            } else {
                if (hasMoreProducts) {
                    loadMoreContainer.style.display = 'block';
                    endMessage.style.display = 'none';
                } else {
                    loadMoreContainer.style.display = 'none';
                    endMessage.style.display = 'block';
                }
            }
        }

        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.setAttribute('data-product-id', product.id);

            const isInCart = userCartItems.some(item => item.id === product.id);

            const price = Number(product.price) || 0;
            const oldPrice = Number(product.oldPrice) || 0;
            
            let discountHtml = '';
            if (oldPrice > price && oldPrice > 0) {
                const discount = Math.round(((oldPrice - price) / oldPrice) * 100);
                if (discount > 0) {
                    discountHtml = `<div class="discount-badge">${discount}% OFF</div>`;
                }
            }
            const freeDeliveryBadge = product.freeDelivery === true ? `<div class="free-delivery-badge"><i class="fa-solid fa-truck-fast"></i> ফ্রি ডেলিভারি</div>` : '';
            const thumbnail = (product.images && product.images.length > 0) ? product.images[0] : 'https://via.placeholder.com/300?text=GHOTI+MARKET';
            const categoryName = product.categoryName || 'General';
            const shopName = product.shopName || 'GHOTI Seller';
            const productName = product.name || 'Unnamed Product';
            const productSlug = product.slug || product.id;
            const detailUrl = `https://www.ghotimarket.com/product?${escapeHtml(productSlug)}`;

            let actionsHtml = '';
            if (isInCart) {
                actionsHtml = `
                    <div class="already-added-badge">
                        <i class="fa-solid fa-circle-check"></i> ইতিমধ্যে যোগ করা হয়েছে
                    </div>
                    <button class="btn-card-action btn-buy-now">
                        <i class="fa-solid fa-bolt"></i> এখনই কিনুন
                    </button>
                `;
            } else {
                actionsHtml = `
                    <button class="btn-card-action btn-cart-add">
                        <i class="fa-solid fa-cart-plus"></i> কার্টে যোগ
                    </button>
                    <button class="btn-card-action btn-buy-now">
                        <i class="fa-solid fa-bolt"></i> এখনই কিনুন
                    </button>
                `;
            }

            card.innerHTML = `
                <div class="product-img-wrapper" onclick="window.location.href='${detailUrl}'">
                    <span class="category-badge">${escapeHtml(categoryName)}</span>
                    ${discountHtml}
                    ${freeDeliveryBadge} 
                    <img src="${escapeHtml(thumbnail)}" alt="${escapeHtml(productName)}" class="product-img" loading="lazy" onerror="this.src='https://via.placeholder.com/300?text=GHOTI+MARKET'">
                </div>
                <div class="product-info">
                    <div class="product-details-link" onclick="window.location.href='${detailUrl}'">
                        <div class="shop-name">
                            <i class="fa-solid fa-store"></i>
                            ${escapeHtml(shopName)}
                        </div>
                        <div class="product-name">${escapeHtml(productName)}</div>
                    </div>
                    <div>
                        <div class="price-box">
                            <span class="current-price">৳${price}</span>
                            ${oldPrice > price ? `<span class="old-price">৳${oldPrice}</span>` : ''}
                        </div>
                        <div class="product-actions">
                            ${actionsHtml}
                        </div>
                    </div>
                </div>
            `;

            if (isInCart) {
                card.querySelector('.btn-buy-now').addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.location.href = 'cart.html';
                });
            } else {
                card.querySelector('.btn-cart-add').addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleCartOrBuyAction(product, false);
                });
                card.querySelector('.btn-buy-now').addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleCartOrBuyAction(product, true);
                });
            }

            return card;
        }

        function updateAllCardCartStates() {
            const cards = productsGrid.querySelectorAll('.product-card');
            cards.forEach(card => {
                const prodId = card.getAttribute('data-product-id');
                const isInCart = userCartItems.some(item => item.id === prodId);
                const actionsContainer = card.querySelector('.product-actions');
                if (actionsContainer && isInCart) {
                    actionsContainer.innerHTML = `
                        <div class="already-added-badge">
                            <i class="fa-solid fa-circle-check"></i> ইতিমধ্যে যোগ করা হয়েছে
                        </div>
                        <button class="btn-card-action btn-buy-now">
                            <i class="fa-solid fa-bolt"></i> এখনই কিনুন
                        </button>
                    `;
                    actionsContainer.querySelector('.btn-buy-now').addEventListener('click', (e) => {
                        e.stopPropagation();
                        window.location.href = 'cart.html';
                    });
                }
            });
        }

        function handleCartOrBuyAction(product, isBuyNow) {
            if (!currentUser) {
                window.location.href = "https://ghotimarket.com/login";
                return;
            }

            const isInCart = userCartItems.some(item => item.id === product.id);

            if (isInCart) {
                window.location.href = 'cart.html';
                return;
            }

            if (product.variants && Array.isArray(product.variants) && product.variants.length > 0) {
                openVariantModal(product, isBuyNow);
            } else {
                addToCartAction(product, {}, 0, isBuyNow);
            }
        }

        function openVariantModal(product, isBuyNow) {
            activeVariantProduct = product;
            activeIsBuyNow = isBuyNow;
            selectedVariantSelections = {};
            selectedVariantDetails = {};

            const thumbnail = (product.images && product.images.length > 0) ? product.images[0] : 'https://via.placeholder.com/300?text=GHOTI+MARKET';
            const price = Number(product.price) || 0;

            let html = `
                <div class="modal-product-summary">
                    <img src="${escapeHtml(thumbnail)}" alt="" class="modal-product-img">
                    <div>
                        <div style="font-size: 14px; font-weight: 600;">${escapeHtml(product.name)}</div>
                        <div style="font-size: 16px; font-weight: 700; color: var(--orange);" id="modalProductPrice">৳${price}</div>
                    </div>
                </div>
            `;

            product.variants.forEach((vGroup, groupIndex) => {
                let groupName = vGroup.name || vGroup.title || `ভ্যারিয়েন্ট ${groupIndex + 1}`;
                let options = vGroup.options || vGroup.values || (Array.isArray(vGroup) ? vGroup : []);

                html += `
                    <div class="variant-group">
                        <div class="variant-group-title">${escapeHtml(groupName)}</div>
                        <div class="variant-options-grid">
                `;

                options.forEach((opt) => {
                    let optVal = typeof opt === 'object' ? (opt.name || opt.value || opt.label) : opt;
                    let extraPrice = typeof opt === 'object' ? (Number(opt.extraPrice) || Number(opt.price) || 0) : 0;
                    
                    let labelDisplay = extraPrice > 0 ? `${escapeHtml(optVal)} (+৳${extraPrice})` : escapeHtml(optVal);

                    html += `<button type="button" class="variant-chip" data-group="${escapeHtml(groupName)}" data-value="${escapeHtml(optVal)}" data-extra="${extraPrice}">${labelDisplay}</button>`;
                });

                html += `</div></div>`;
            });

            variantModalBody.innerHTML = html;
            variantModalOverlay.style.display = 'flex';

            variantModalBody.querySelectorAll('.variant-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const group = chip.getAttribute('data-group');
                    const value = chip.getAttribute('data-value');
                    const extra = Number(chip.getAttribute('data-extra')) || 0;

                    chip.closest('.variant-group').querySelectorAll('.variant-chip').forEach(c => c.classList.remove('selected'));
                    chip.classList.add('selected');
                    
                    selectedVariantSelections[group] = value;
                    selectedVariantDetails[group] = { name: value, extraPrice: extra };

                    updateModalPrice();
                });
            });
        }

        function updateModalPrice() {
            if (!activeVariantProduct) return;
            const basePrice = Number(activeVariantProduct.price) || 0;
            let totalExtra = 0;
            for (let g in selectedVariantDetails) {
                totalExtra += Number(selectedVariantDetails[g].extraPrice) || 0;
            }
            const finalPrice = basePrice + totalExtra;
            const modalPriceEl = document.getElementById('modalProductPrice');
            if (modalPriceEl) {
                modalPriceEl.textContent = `৳${finalPrice}`;
            }
        }

        closeVariantModalBtn.addEventListener('click', () => {
            variantModalOverlay.style.display = 'none';
        });

        variantModalOverlay.addEventListener('click', (e) => {
            if (e.target === variantModalOverlay) variantModalOverlay.style.display = 'none';
        });

        confirmVariantBtn.addEventListener('click', () => {
            if (!activeVariantProduct) return;
            const groups = activeVariantProduct.variants || [];
            for (let i = 0; i < groups.length; i++) {
                let gName = groups[i].name || groups[i].title || `ভ্যারিয়েন্ট ${i + 1}`;
                if (!selectedVariantSelections[gName]) {
                    showToast(`দয়া করে "${gName}" সিলেক্ট করুন!`, 'error');
                    return;
                }
            }
            variantModalOverlay.style.display = 'none';

            let totalExtra = 0;
            for (let g in selectedVariantDetails) {
                totalExtra += Number(selectedVariantDetails[g].extraPrice) || 0;
            }

            addToCartAction(activeVariantProduct, selectedVariantSelections, totalExtra, activeIsBuyNow);
        });

        async function addToCartAction(product, selectedVariants = {}, extraPrice = 0, isBuyNow = false) {
            if (!currentUser) {
                window.location.href = "https://ghotimarket.com/login";
                return;
            }

            const basePrice = Number(product.price) || 0;
            const finalPrice = basePrice + extraPrice;

            const existingItem = userCartItems.find(item => item.id === product.id);

            try {
                if (existingItem) {
                    const newQuantity = (existingItem.quantity || 1) + 1;
                    const cartDocRef = doc(db, "carts", existingItem.cartDocId);
                    
                    const updateData = { quantity: newQuantity };
                    if ((product.affiliate === "on" || product.affiliate === true) && product.discount) {
                        updateData.discount = Number(product.discount) || 0;
                    }
                    
                    await updateDoc(cartDocRef, updateData);
                    existingItem.quantity = newQuantity;
                    if (updateData.discount !== undefined) {
                        existingItem.discount = updateData.discount;
                    }
                } else {
                    const newCartData = {
                        uid: currentUser.uid,
                        email: currentUser.email || '',
                        id: product.id,
                        docId: product.id,
                        slug: product.slug || product.id,
                        name: product.name || '',
                        basePrice: basePrice,
                        extraPrice: extraPrice,
                        price: finalPrice,
                        selectedVariants: selectedVariants,
                        image: (product.images && product.images[0]) || '',
                        quantity: 1,
                        shopName: product.shopName || '',
                        sellerId: product.sellerId || '',
                        affiliate: product.affiliate || false,
                        freeDelivery: product.freeDelivery === true ? true : false,  
                        discount: (product.affiliate === "on" || product.affiliate === true) && product.discount ? Number(product.discount) || 0 : 0,
                        createdAt: serverTimestamp()
                    };

                    const docRef = await addDoc(collection(db, "carts"), newCartData);
                    userCartItems.push({ cartDocId: docRef.id, ...newCartData });
                }

                updateCartBadge();
                updateAllCardCartStates();

                if (isBuyNow) {
                    window.location.href = 'cart.html';
                } else {
                    showToast('পণ্যটি সফলভাবে কার্টে যোগ করা হয়েছে! 🛒', 'success');
                }
            } catch (err) {
                console.error("Error adding to Firestore cart:", err);
                showToast('কার্টে যোগ করতে সমস্যা হয়েছে!', 'error');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function renderEmptyState() {
            productsGrid.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 18px; font-weight: 700;">কোনো পণ্য পাওয়া যায়নি</div>
                    <div style="font-size: 13px; color: var(--text-light); margin-top: 5px;">অন্য কিছু দিয়ে সার্চ করুন।</div>
                </div>
            `;
            loadMoreContainer.style.display = 'none';
            endMessage.style.display = 'none';
        }

        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const term = e.target.value.toLowerCase().trim();
                
                if (term === "") {
                    isSearching = false;
                    filteredProducts = [];
                    productsGrid.innerHTML = '';
                    renderBatch(allProducts);
                    return;
                }

                isSearching = true;
                filteredProducts = allProducts.filter(item => {
                    return (item.name || "").toLowerCase().includes(term) ||
                           (item.categoryName || "").toLowerCase().includes(term) ||
                           (item.shopName || "").toLowerCase().includes(term);
                });

                productsGrid.innerHTML = '';

                if (filteredProducts.length === 0) {
                    renderEmptyState();
                } else {
                    renderBatch(filteredProducts);
                }
            }, 300);
        });

        loadMoreBtn.addEventListener('click', () => {
            fetchProducts(true);
        });

        // Authentication State Listener - FIXED
onAuthStateChanged(auth, async (user) => {
    if (user) {
        currentUser = user;
        await fetchUserCart();
    } else {
        currentUser = null;
        userCartItems = [];
        updateCartBadge();
    }
    // লগিন থাকুক বা না থাকুক, Product সবাই দেখবে
    fetchProducts(false);
});
