<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Step 1 | Ghoti Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1a2a3a; --success: #2ecc71; --accent: #3498db; --bg: #f1f2f6; }
        
        body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: linear-gradient(135deg, #1a2a3a, #2c3e50);
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            color: #333;
        }

        .signup-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo-icon {
            font-size: 50px;
            color: var(--success);
            margin-bottom: 15px;
        }

        h2 { margin: 0 0 10px; font-size: 24px; color: var(--primary); }
        p.step-info { color: #777; font-size: 14px; margin-bottom: 30px; }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 15px; top: 15px; color: #aaa; }
        
        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background: #fdfdfd;
        }

        input:focus { border-color: var(--success); box-shadow: 0 0 10px rgba(46,204,113,0.1); }

        .btn-continue {
            background: var(--success);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(46,204,113,0.3);
        }

        .btn-continue:active { transform: scale(0.97); }

        .divider { margin: 25px 0; display: flex; align-items: center; color: #bbb; font-size: 12px; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #eee; margin: 0 10px; }

        .btn-login {
            background: none;
            border: 2px solid var(--accent);
            color: var(--accent);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover { background: var(--accent); color: white; }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="logo-icon"><i class="fas fa-user-plus"></i></div>
    <h2>অ্যাকাউন্ট তৈরি</h2>
    <p class="step-info">ধাপ ১: আপনার ইমেইল ও পাসওয়ার্ড দিন</p>

    <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="আপনার ইমেইল">
    </div>

    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="pass" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ ডিজিট)">
    </div>

    <button onclick="step1()" id="regBtn" class="btn-continue">কন্টিনিউ করুন</button>

    <div class="divider">আগে থেকেই অ্যাকাউন্ট আছে?</div>

    <button onclick="goLogin()" class="btn-login">লগিন করুন</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
    projectId: "ghotimarket",
    authDomain: "ghotimarket.firebaseapp.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.step1 = async () => {
    const e = document.getElementById('email').value.trim();
    const p = document.getElementById('pass').value.trim();
    const btn = document.getElementById('regBtn');

    if(!e || !p){
        alert("ইমেইল ও পাসওয়ার্ড দিন!");
        return;
    }

    if(p.length < 6) {
        alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।");
        return;
    }

    btn.disabled = true;
    btn.innerText = "অপেক্ষা করুন...";

    try {
        await createUserWithEmailAndPassword(auth, e, p);
        window.location.href = "profile-setup.html";
    } catch (err) {
        btn.disabled = false;
        btn.innerText = "কন্টিনিউ করুন";
        
        // সহজ বাংলা এরর মেসেজ
        if(err.code === 'auth/email-already-in-use') {
            alert("এই ইমেইলটি দিয়ে ইতিমধ্যে অ্যাকাউন্ট খোলা হয়েছে।");
        } else if(err.code === 'auth/invalid-email') {
            alert("সঠিক ইমেইল ফরম্যাট ব্যবহার করুন।");
        } else {
            alert("সমস্যা: " + err.message);
        }
    }
}

window.goLogin = () => {
    window.location.href = "login.html";
}
</script>

</body>
</html>
