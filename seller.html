<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Profile | Ghoti Market</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        :root { --primary: #0f172a; --accent: #f97316; --glass: rgba(255, 255, 255, 0.8); }
        body { font-family: 'Hind Siliguri', sans-serif; background: #f1f5f9; margin: 0; padding-bottom: 80px; }
        
        /* Glass UI Components */
        .glass-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.05); }
        
        .header { background: var(--primary); padding: 15px; color: white; display: flex; align-items: center; gap: 10px; position: sticky; top:0; z-index: 100; }
        .back-btn { color: white; text-decoration: none; font-size: 1.2rem; }

        .profile-header { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #0f172a, #1e293b); color: white; border-radius: 0 0 30px 30px; }
        .shop-logo { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--accent); margin-bottom: 10px; }

        .summary-section { margin: -30px 15px 20px; }
        .rating-box { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .avg-num { font-size: 3rem; font-weight: 800; color: var(--primary); margin: 0; }
        
        .progress-container { flex: 1; }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 10px; margin: 5px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: 0.5s; }

        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; font-family: inherit; margin-top: 15px; }
        .btn-orange { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(249,115,22,0.3); }
        .btn-orange:active { transform: scale(0.95); }

        /* Review Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 450px; border-radius: 25px; padding: 25px; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } }

        .stars { display: flex; gap: 10px; justify-content: center; font-size: 30px; color: #cbd5e1; margin: 15px 0; }
        .stars i.active { color: var(--accent); }
        .input-group { margin-bottom: 15px; }
        .input-group input, .input-group textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; outline: none; font-family: inherit; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="header">
        <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <span style="font-weight: 600;">শপ প্রোফাইল</span>
    </div>

    <div class="profile-header">
        <img id="shopLogo" src="https://i.ibb.co/RG2hrf3y/background-remove-ghoti-market.png" class="shop-logo">
        <h1 id="shopName" style="margin:0; font-size: 22px;">লোড হচ্ছে...</h1>
    </div>

    <div class="summary-section">
        <div class="glass-card">
            <div class="rating-box">
                <div>
                    <h2 class="avg-num" id="avgRating">0.0</h2>
                    <div style="color: var(--accent); font-size: 14px;" id="avgStars"></div>
                    <p style="font-size: 12px; color: #64748b; margin: 5px 0;" id="totalReviews">0 রিভিউ</p>
                </div>
                <div class="progress-container" id="ratingBreakdown">
                    <!-- ব্রেকডাউন লোড হবে এখানে -->
                </div>
            </div>
            <button class="btn-main btn-orange" id="writeReviewBtn">
                <i class="fas fa-pen-nib"></i> একটি রিভিউ লিখুন
            </button>
        </div>
    </div>

    <!-- Review Modal -->
    <div class="modal" id="reviewModal">
        <div class="modal-content">
            <h3 style="margin-top:0; text-align:center;">আপনার অভিজ্ঞতা শেয়ার করুন</h3>
            <div class="stars" id="starInput">
                <i class="fas fa-star" data-value="1"></i>
                <i class="fas fa-star" data-v="2"></i>
                <i class="fas fa-star" data-v="3"></i>
                <i class="fas fa-star" data-v="4"></i>
                <i class="fas fa-star" data-v="5"></i>
            </div>
            <div class="input-group">
                <input type="text" id="revTitle" placeholder="রিভিউ টাইটেল">
            </div>
            <div class="input-group">
                <textarea id="revMessage" rows="4" placeholder="আপনার বিস্তারিত মতামত লিখুন..."></textarea>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-main" style="background: #f1f5f9;" id="closeModal">বাতিল</button>
                <button class="btn-main btn-orange" id="submitReview">রিভিউ জমা দিন</button>
            </div>
            <div id="deleteZone" style="margin-top: 10px;"></div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from "./firebase.js";
        import { doc, getDoc, collection, query, where, getDocs, onSnapshot, setDoc, addDoc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        let currentSellerId = "";
        let currentSellerUser = "";
        let currentUser = null;
        let selectedRating = 0;
        let existingReviewId = null;

        // ১. সেলার ইউজারনেম বের করা
        const params = new URLSearchParams(window.location.search);
        let username = "";
        for (const [key, value] of params.entries()) {
            if (key.startsWith('@')) { username = key.substring(1); break; }
        }

        // ২. সেলার প্রোফাইল লোড করা
        async function loadSeller() {
            const q = query(collection(db, "users"), where("username", "==", username));
            const snap = await getDocs(q);
            if (!snap.empty) {
                const seller = snap.docs[0].data();
                currentSellerId = snap.docs[0].id;
                currentSellerUser = username;
                document.getElementById('shopName').innerText = seller.shopName;
                document.getElementById('shopLogo').src = seller.shopLogo || document.getElementById('shopLogo').src;
                
                initReviewSystem();
            }
        }

        // ৩. রিভিউ সিস্টেম ইনিশিয়েট
        function initReviewSystem() {
            // রিয়েলটাইম স্ট্যাটস আপডেট
            const q = query(collection(db, "reviews"), where("sellerId", "==", currentSellerId));
            onSnapshot(q, (snap) => {
                let total = snap.size;
                let sum = 0;
                let counts = {5:0, 4:0, 3:0, 2:0, 1:0};
                
                snap.forEach(d => {
                    const r = d.data().rating;
                    sum += r;
                    counts[r]++;
                });

                const avg = total > 0 ? (sum / total).toFixed(1) : "0.0";
                document.getElementById('avgRating').innerText = avg;
                document.getElementById('totalReviews').innerText = `${total} রিভিউ`;
                
                // ব্রেকডাউন রেন্ডার
                let breakdownHtml = "";
                [5,4,3,2,1].forEach(num => {
                    const perc = total > 0 ? (counts[num]/total)*100 : 0;
                    breakdownHtml += `
                        <div style="display:flex; align-items:center; gap:8px; font-size:10px;">
                            <span style="width:15px;">${num}★</span>
                            <div class="progress-bar" style="flex:1;"><div class="progress-fill" style="width:${perc}%"></div></div>
                            <span style="width:15px; text-align:right;">${counts[num]}</span>
                        </div>
                    `;
                });
                document.getElementById('ratingBreakdown').innerHTML = breakdownHtml;
            });
        }

        // ৪. লগইন এবং রিডাইরেক্ট লজিক
        document.getElementById('writeReviewBtn').onclick = () => {
            if (!currentUser) {
                localStorage.setItem('pendingRedirect', window.location.href);
                localStorage.setItem('openReviewModal', 'true');
                window.location.href = "https://auth.ghotimarket.com";
            } else {
                openModal();
            }
        };

        // ৫. অটো মোডাল ওপেন চেক
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user && localStorage.getItem('openReviewModal') === 'true') {
                localStorage.removeItem('openReviewModal');
                openModal();
            }
        });

        // ৬. মোডাল লজিক (CRUD)
        async function openModal() {
            const modal = document.getElementById('reviewModal');
            modal.style.display = 'flex';
            
            // পূর্বের রিভিউ চেক
            const q = query(collection(db, "reviews"), where("sellerId", "==", currentSellerId), where("userUid", "==", currentUser.uid));
            const snap = await getDocs(q);
            
            if (!snap.empty) {
                const data = snap.docs[0].data();
                existingReviewId = snap.docs[0].id;
                selectedRating = data.rating;
                document.getElementById('revTitle').value = data.title;
                document.getElementById('revMessage').value = data.message;
                updateStarUI(data.rating);
                document.getElementById('submitReview').innerText = "আপডেট করুন";
                document.getElementById('deleteZone').innerHTML = `<button id="delBtn" class="btn-main" style="color:red; background: #fff1f2;">ডিলিট করুন</button>`;
                document.getElementById('delBtn').onclick = deleteReview;
            } else {
                resetModal();
            }
        }

        function updateStarUI(val) {
            const stars = document.querySelectorAll('#starInput i');
            stars.forEach((s, i) => {
                s.className = (i < val) ? 'fas fa-star active' : 'fas fa-star';
            });
        }

        document.querySelectorAll('#starInput i').forEach((s, i) => {
            s.onclick = () => {
                selectedRating = i + 1;
                updateStarUI(selectedRating);
            };
        });

        document.getElementById('submitReview').onclick = async () => {
            if (selectedRating === 0) return alert("রেটিং দিন!");
            const title = document.getElementById('revTitle').value;
            const message = document.getElementById('revMessage').value;

            const reviewData = {
                sellerId: currentSellerId,
                sellerUsername: currentSellerUser,
                userUid: currentUser.uid,
                userName: currentUser.displayName,
                userPhoto: currentUser.photoURL,
                rating: selectedRating,
                title: title,
                message: message,
                updatedAt: serverTimestamp()
            };

            if (existingReviewId) {
                await updateDoc(doc(db, "reviews", existingReviewId), reviewData);
            } else {
                reviewData.createdAt = serverTimestamp();
                await addDoc(collection(db, "reviews"), reviewData);
            }
            
            modal.style.display = 'none';
            alert("ধন্যবাদ! রিভিউ সফল হয়েছে।");
        };

        async function deleteReview() {
            if (confirm("রিভিউটি ডিলিট করতে চান?")) {
                await deleteDoc(doc(db, "reviews", existingReviewId));
                location.reload();
            }
        }

        function resetModal() {
            existingReviewId = null;
            selectedRating = 0;
            document.getElementById('revTitle').value = "";
            document.getElementById('revMessage').value = "";
            updateStarUI(0);
            document.getElementById('submitReview').innerText = "রিভিউ জমা দিন";
            document.getElementById('deleteZone').innerHTML = "";
        }

        document.getElementById('closeModal').onclick = () => document.getElementById('reviewModal').style.display = 'none';
        
        loadSeller();
    </script>
</body>
</html>
