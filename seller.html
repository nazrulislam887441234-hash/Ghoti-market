<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="metaTitle">Seller Profile | Ghoti Market</title>
    
    <!-- FAVICON + THEME COLOR ORANGE -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/RG2hrf3y/background-remove-ghoti-market.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/RG2hrf3y/background-remove-ghoti-market.png">
    <meta name="theme-color" content="#f97316">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
   <style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&display=swap');
:root { 
    --primary: #0f172a; 
    --bg: #f8fafc; 
    --accent: #f97316; 
    --accent2: #fb923c;
    --danger: #ff4757; 
    --glass: rgba(255,255,255,0.85);
}
* { box-sizing: border-box; } /* এটা সবচেয়ে জরুরি */
html, body { 
    font-family: 'Hind Siliguri', sans-serif; 
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
    margin: 0; 
    padding: 0; /* body তে padding বাদ */
    overflow-x: hidden; /* সাইডে স্ক্রল বন্ধ */
    width: 100%;
    padding-bottom: 80px; 
}

/* 1. NATIVE GLASS HEADER BAR */
.native-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(25px) saturate(180%);
    padding: 12px 15px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    width: 100%;
}
.back-btn { 
    background: rgba(255,255,255,0.1); 
    color: white; 
    width: 40px; 
    height: 40px; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    text-decoration: none; 
    font-size: 18px; 
    transition:0.3s;
}
.back-btn:active { background: var(--accent); transform:scale(0.9); }

/* Profile Section - Premium */
.profile-container { 
    position: relative; 
    background: var(--glass);
    backdrop-filter: blur(16px);
    border-radius: 0 0 25px 25px; 
    overflow: hidden; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
    padding-bottom: 20px; 
    border:1px solid rgba(255,255,255,0.5);
    width: 100%;
}
.banner-box { 
    position: relative; 
    width: 100%; 
    padding-top: 40%; /* মোবাইলে একটু বেশি */
    background: linear-gradient(135deg, #e2e8f0, #cbd5e1); 
}
.banner-box img { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    display: none; 
}
        
/* Logo + Name Area */
.profile-info-box { text-align: center; padding: 15px 15px 0; margin-top:-45px; position:relative; z-index:2; }
.shop-icon { 
    width: 90px; 
    height: 90px; 
    background: white; 
    border-radius: 50%; 
    margin: 0 auto 12px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    border: 4px solid white; 
    box-shadow: 0 8px 25px rgba(0,0,0,0.15); 
    overflow: hidden; 
}
.shop-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* VERIFIED BADGE - NAMER PASHE */
.shop-name-area { 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 8px; 
    padding:0 10px; /* নাম যেন না কাটে */
}
.shop-name-area h1 { 
    font-size: 20px; 
    margin: 0; 
    font-weight:800;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    word-break: break-word; /* লম্বা নাম ভেঙে যাবে */
}
.verified-badge {
    width: 22px;
    height: 22px;
    background: #1877F2;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink:0;
    box-shadow:0 3px 10px rgba(24,119,242,0.4);
}
.verified-badge svg { width: 12px; height: 12px; }

.search-area { 
    padding: 15px; 
    position: sticky; 
    top: 64px; /* Header height অনুযায়ী */
    z-index: 99; 
    background: var(--bg); /* transparent বাদ দিলাম নাহলে নড়ে */
}
.search-bar { 
    width: 100%; 
    max-width: 800px; 
    margin: 0 auto; 
    display: block; 
    padding: 14px 20px; 
    border-radius: 50px; 
    border: 2px solid #e2e8f0; 
    box-shadow: 0 5px 20px rgba(0,0,0,0.06); 
    outline: none; 
    font-size: 15px; 
    font-family:'Hind Siliguri';
    transition:0.3s;
    background:white;
}
.search-bar:focus { 
    border-color: var(--accent);
    box-shadow: 0 5px 20px rgba(249, 115, 22, 0.2); 
}

.wa-float { 
    position: fixed; 
    bottom: 90px; /* Bottom Nav এর উপরে */
    right: 15px; 
    background: #25D366; 
    color: white; 
    width: 55px; 
    height: 55px; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 26px; 
    box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4); 
    z-index: 1000; 
    text-decoration: none; 
}

/* Responsive Grid - FIXED */
.grid { 
    display: grid; 
    gap: 12px; /* gap কমালাম */
    padding: 12px; /* padding কমালাম */
    grid-template-columns: repeat(2, 1fr); 
    max-width: 1400px; 
    margin: 0 auto; 
    width: 100%;
}
@media (min-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); gap:15px; padding:15px; } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(6, 1fr); gap:20px; padding:20px; } }

.p-card { 
    background: white; /* Glass বাদ দিলাম মোবাইলে lag করে */
    border-radius: 16px; 
    overflow: hidden; 
    box-shadow: 0 3px 12px rgba(0,0,0,0.06); 
    text-decoration: none; 
    color: #333; 
    transition:0.2s; /* animation কম */
    border:1px solid #f1f5f9;
}
.p-card:active { transform:scale(0.96); } /* hover বাদ, শুধু tap */
.img-box { position: relative; padding-top: 100%; background: #f8fafc; overflow:hidden; }
.img-box img { position: absolute; top: 0; width: 100%; height: 100%; object-fit: cover; }
.p-info { padding: 10px; }
.p-name { font-size: 13px; font-weight: 600; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 5px; }
.p-price { color: var(--danger); font-weight: 700; font-size: 14px; }
        
.see-more-btn { 
    display: block; 
    width: 200px; 
    margin: 25px auto; 
    padding: 14px; 
    background: linear-gradient(135deg, var(--accent), var(--accent2)); 
    color: white; 
    border: none; 
    border-radius: 50px; 
    cursor: pointer; 
    font-weight:700; 
    font-size:15px;
    box-shadow:0 6px 20px rgba(249,115,22,0.3); 
}

/* Bottom Navigation - iPhone Style */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 65px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(25px) saturate(180%);
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.08);
    border-top: 1px solid rgba(0,0,0,0.05);
    z-index: 9999;
    padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #64748b;
    font-size: 10px;
    font-weight: 600;
    transition: 0.2s;
    width: 25%;
}
.nav-item i {
    font-size: 21px;
    margin-bottom: 3px;
}
.nav-item.active {
    color: var(--accent);
}
.price-box{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:6px;
    margin-top:6px;
}

.current-price{
    color:#16A34A;
    font-size:18px;
    font-weight:700;
}

.old-price{
    color:#94A3B8;
    text-decoration:line-through;
    font-size:14px;
}

.discount-badge{
    background:#EF4444;
    color:#fff;
    font-size:11px;
    font-weight:700;
    padding:3px 7px;
    border-radius:20px;
}

.save-text{
    width:100%;
    color:#DC2626;
    font-size:12px;
    font-weight:600;
    margin-top:3px;
}
</style>
</head>
<body>

    <!-- 3. NATIVE GLASS BAR -->
    <div class="native-bar">
        <a href="https://ghotimarket.com" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    </div>

    <div class="profile-container">
        <div class="banner-box"><img id="shopBannerImg" src="" alt="Banner"></div>
        <div class="profile-info-box">
            <div class="shop-icon">
                <img id="shopLogoImg" src="" alt="Logo">
            </div>
            <div class="shop-name-area">
                <h1 id="shopName">Loading...</h1>
                <!-- VERIFIED BADGE NAMER PASHE -->
                <div id="verifiedBadge" class="verified-badge" style="display:none;" title="Verified Shop">
                    <svg viewBox="0 0 24 24" fill="white">
                        <path d="M9.1 13.8l-2.3-2.3c-.4-.4-1-.4-1.4 0-.4.4-.4 1 0 1.4l3 3c.2.2.5.3.7.3.2 0 .5-.1.7-.3l5.8-5.8c.4-.4.4-1 0-1.4-.4-.4-1-.4-1.4 0L9.1 13.8z"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <div class="search-area">
        <input type="text" id="pSearch" class="search-bar" placeholder="পণ্য খুঁজুন..." oninput="handleSearch()">
    </div>
  <!-- Bottom Navigation -->
<nav class="bottom-nav">
    <a href="https://ghotimarket.com" class="nav-item">
        <i data-lucide="home"></i>
        <span>Home</span>
    </a>

    <a href="https://ghotimarket.com/categories" class="nav-item">
        <i data-lucide="grid"></i>
        <span>Categories</span>
    </a>

    <a href="https://ghotimarket.com/all-product" class="nav-item">
        <i data-lucide="box"></i>
        <span>All product</span>
    </a>

    <a href="https://ghotimarket.com/contact" class="nav-item">
        <i data-lucide="headphones"></i>
        <span>Support</span>
    </a>

    <a href="https://ghotimarket.com/privacy-policy" class="nav-item">
        <i data-lucide="shield-check"></i>
        <span>Privacy</span>
    </a>

    <a href="https://seller.ghotimarket.com/signup" class="nav-item">
        <i data-lucide="store"></i>
        <span>J.Seller</span>
    </a>
</nav>
    <div class="grid" id="sellerProductGrid"></div>
    <button id="seeMoreBtn" class="see-more-btn" style="display:none;" onclick="loadMore()">See More</button>

<script type="module">
                import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
          getFirestore,
          doc,
          getDoc,
          collection,
          query,
          where,
          getDocs,
          limit
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", projectId: "ghotimarket" }));

        // ===== ADVANCED ROBUST URL PARSER & IDENTIFIER =====
        function parseTargetFromURL() {
            try {
                const search = window.location.search;
                const urlParams = new URLSearchParams(search);

                // Priority 1: Explicit ?sellerId=xxxxx parameter
                let sellerIdVal = urlParams.get("sellerId");
                if (sellerIdVal && sellerIdVal.trim() !== "") {
                    return { type: "explicit_sellerId", value: decodeURIComponent(sellerIdVal.trim()) };
                }

                // Priority 2: Explicit ?username=xxxxx parameter
                let usernameVal = urlParams.get("username");
                if (usernameVal && usernameVal.trim() !== "") {
                    let cleanU = decodeURIComponent(usernameVal.trim());
                    if (cleanU.startsWith('@')) cleanU = cleanU.substring(1);
                    return { type: "explicit_username", value: cleanU };
                }

                // Priority 3: Explicit ?@luxuryshop parameter
                let atVal = urlParams.get("@");
                if (atVal && atVal.trim() !== "") {
                    let cleanU = decodeURIComponent(atVal.trim());
                    if (cleanU.startsWith('@')) cleanU = cleanU.substring(1);
                    return { type: "explicit_at", value: cleanU };
                }

                // Scan all URL keys for Facebook shares or URL-encoded attributes like ?%40luxuryshop
                for (const [key, value] of urlParams.entries()) {
                    let cleanKey = decodeURIComponent(key.trim());
                    if (cleanKey && cleanKey !== 'fbclid' && cleanKey !== 'gclid' && !cleanKey.startsWith('utm_')) {
                        if (cleanKey.startsWith('@')) {
                            return { type: "encoded_at", value: cleanKey.substring(1) };
                        }
                        if (value === '' && !cleanKey.includes('=')) {
                            let cleanVal = cleanKey.replace(/^@/, '');
                            return { type: "raw_param", value: cleanVal };
                        }
                    }
                }

                // Priority 4: Fallback to raw path search string (e.g. ?oBalDCzGc3XxNVwPvKckosgWD5m2 or ?luxuryshop)
                if (search && search.length > 1) {
                    const raw = decodeURIComponent(search.substring(1).split('&')[0].trim());
                    if (raw && !raw.includes('=') && !raw.startsWith('fbclid') && !raw.startsWith('gclid') && !raw.startsWith('utm_')) {
                        let cleanRaw = raw;
                        if (cleanRaw.startsWith('@')) cleanRaw = cleanRaw.substring(1);
                        return { type: "raw_value", value: cleanRaw };
                    }
                }

                // Fallback to window hash if present
                if (window.location.hash) {
                    let hashVal = decodeURIComponent(window.location.hash.substring(1).trim());
                    if (hashVal) {
                        if (hashVal.startsWith('@')) hashVal = hashVal.substring(1);
                        return { type: "hash_value", value: hashVal };
                    }
                }

                return { type: null, value: null };
            } catch (err) {
                console.error("URL Parsing Error:", err);
                return { type: null, value: null };
            }
        }
        // ===== END =====

        let allProducts = [];
        let filteredProducts = [];
        let displayCount = 100;

        async function loadProfile() {
            try {
                const target = parseTargetFromURL();
                console.log("Detected URL Type:", target.type);
                console.log("Detected Value:", target.value);

                if (!target.type || !target.value) {
                    console.warn("Fallback Used: No valid identifier found in URL");
                    document.getElementById("shopName").innerText = "Shop Not Found";
                    return;
                }

                let sId = null;
                let d = null;

                // Rule-based execution according to priority and strict requirements
                if (target.type === "explicit_sellerId") {
                    console.log("Firestore Method: getDoc(doc(db, 'users', sellerId))");
                    const userDocRef = doc(db, "users", target.value);
                    const userDocSnap = await getDoc(userDocRef);

                    if (userDocSnap.exists()) {
                        sId = userDocSnap.id;
                        d = userDocSnap.data();
                        console.log("Loaded Successfully via explicit_sellerId");
                    } else {
                        console.warn("Shop Not Found for provided sellerId");
                    }
                } else if (target.type === "explicit_username" || target.type === "explicit_at" || target.type === "encoded_at") {
                    console.log("Firestore Method: query(collection(db, 'users'), where('username', '==', username), limit(1))");
                    const userQuery = query(
                        collection(db, "users"),
                        where("username", "==", target.value),
                        limit(1)
                    );
                    const userSnap = await getDocs(userQuery);

                    if (!userSnap.empty) {
                        sId = userSnap.docs[0].id;
                        d = userSnap.docs[0].data();
                        console.log("Loaded Successfully via username query");
                    } else {
                        console.warn("Shop Not Found for provided username");
                    }
                } else {
                    // For raw values: First try getDoc, if not exists, query users where username == value
                    console.log("Firestore Method: trying document ID lookup first for raw value");
                    const userDocRef = doc(db, "users", target.value);
                    const userDocSnap = await getDoc(userDocRef);

                    if (userDocSnap.exists()) {
                        sId = userDocSnap.id;
                        d = userDocSnap.data();
                        console.log("Loaded Successfully as sellerId (Document ID)");
                    } else {
                        console.log("Document ID not found, trying username query fallback");
                        const userQuery = query(
                            collection(db, "users"),
                            where("username", "==", target.value),
                            limit(1)
                        );
                        const userSnap = await getDocs(userQuery);

                        if (!userSnap.empty) {
                            sId = userSnap.docs[0].id;
                            d = userSnap.docs[0].data();
                            console.log("Loaded Successfully via username query fallback");
                        } else {
                            console.warn("Shop Not Found: Both sellerId and username lookup failed.");
                        }
                    }
                }

                if (!sId || !d) {
                    document.getElementById("shopName").innerText = "Shop Not Found";
                    return;
                }

                document.getElementById('shopName').innerText = d.shopName || "Unknown Shop";
                document.getElementById('metaTitle').innerText = `${d.shopName || "Shop"} | Ghoti Market`;

                if (d.shopLogo) {
                    document.getElementById('shopLogoImg').src = d.shopLogo;
                }

                if (d.shopBanner) {
                    document.getElementById('shopBannerImg').src = d.shopBanner;
                    document.getElementById('shopBannerImg').style.display = "block";
                }

                if (d.verified) {
                    document.getElementById('verifiedBadge').style.display = "flex";
                }

                const productQuery = query(
                    collection(db, "products"),
                    where("sellerId", "==", sId),
                    where("active", "==", true)
                );

                const productSnap = await getDocs(productQuery);

                allProducts = productSnap.docs.map(productDoc => ({
                    id: productDoc.id,
                    ...productDoc.data()
                }));

                filteredProducts = allProducts;
                render();
            } catch (error) {
                console.error("Profile Load Error:", error);
                document.getElementById("shopName").innerText = "Shop Not Found";
            }
        }

        window.handleSearch = () => {
            const term = document.getElementById('pSearch').value.toLowerCase().trim();
            filteredProducts = allProducts.filter(p =>
                p.name?.toLowerCase().includes(term) ||
                (Array.isArray(p.keywords) ? p.keywords.some(k => k.toLowerCase().includes(term)) : p.keywords?.toLowerCase().includes(term))
            );
            displayCount = 100;
            render();
        };

        window.loadMore = () => {
            displayCount += 100;
            render();
        };

        function render() {
            const grid = document.getElementById('sellerProductGrid');
            const btn = document.getElementById('seeMoreBtn');
            const dataToDisplay = filteredProducts.slice(0, displayCount);

            grid.innerHTML = dataToDisplay.length ? dataToDisplay.map(p => `
              <a href="${
                p.slug
                   ? `https://ghotimarket.com/product?${p.slug}`
                    : `https://ghotimarket.com/product?id=${p.id}`
            }" class="p-card">
                    <div class="img-box"><img src="${p.images?.[0] || ''}" alt="${p.name || ''}"></div>
                    <div class="p-info">
                        <div class="p-name">${p.name || ''}</div>
                      <div class="price-box">
                        <span class="current-price">৳${p.price || 0}</span>

                        ${
                            p.oldPrice && Number(p.oldPrice) > Number(p.price)
                           ? `
                            <span class="old-price">৳${p.oldPrice}</span>

                            <span class="discount-badge">
                                ${Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100)}% OFF
                            </span>

                            <div class="save-text">
                                Save ৳${p.oldPrice - p.price}
                            </div>
                            `
                            : ""
                        }
                    </div>

                    </div>
                </a>
            `).join('') : '<p style="text-align:center; grid-column:1/-1; padding:40px;">😔 কোনো পণ্য পাওয়া যায়নি!</p>';

            btn.style.display = (displayCount < filteredProducts.length) ? 'block' : 'none';
        }

        loadProfile();
    </script>
<script>
  lucide.createIcons();
</script>
</body>
</html>
