<head>

    <link rel="apple-touch-icon" href="https://i.ibb.co/RG2hrf3y/background-remove-ghoti-market.png">
    <meta name="theme-color" content="#f97316">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&display=swap');
        :root { 
            --primary: #0f172a; 
            --bg: #f8fafc; 
            --accent: #f97316; 
            --accent2: #fb923c;
            --danger: #ff4757; 
            --glass: rgba(255,255,255,0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        * { box-sizing: border-box; }
        html, body { 
            font-family: 'Hind Siliguri', sans-serif; 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden; 
            width: 100%;
            padding-bottom: 80px; 
            scroll-behavior: smooth;
        }

        /* 1. NATIVE GLASS HEADER BAR */
        .native-bar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(25px) saturate(180%);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            width: 100%;
        }
        .back-btn { 
            background: rgba(255,255,255,0.1); 
            color: white; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none; 
            font-size: 18px; 
            transition:0.3s;
        }
        .back-btn:active { background: var(--accent); transform:scale(0.9); }

        /* Profile Section */
        .profile-container { 
            position: relative; 
            background: var(--glass);
            backdrop-filter: blur(16px);
            border-radius: 0 0 25px 25px; 
            overflow: hidden; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
            padding-bottom: 20px; 
            border:1px solid var(--glass-border);
            width: 100%;
        }
        .banner-box { 
            position: relative; 
            width: 100%; 
            padding-top: 40%; 
            background: linear-gradient(135deg, #e2e8f0, #cbd5e1); 
        }
        .banner-box img { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: none; 
        }
        
        .profile-info-box { text-align: center; padding: 15px 15px 0; margin-top:-45px; position:relative; z-index:2; }
        .shop-icon { 
            width: 90px; 
            height: 90px; 
            background: white; 
            border-radius: 50%; 
            margin: 0 auto 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 4px solid white; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.15); 
            overflow: hidden; 
        }
        .shop-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .shop-name-area { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            padding:0 10px;
        }
        .shop-name-area h1 { 
            font-size: 22px; 
            margin: 0; 
            font-weight:800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            word-break: break-word;
        }
        .verified-badge {
            width: 20px;
            height: 20px;
            background: #1877F2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink:0;
            box-shadow:0 3px 10px rgba(24,119,242,0.4);
        }
        .verified-badge svg { width: 12px; height: 12px; }

        /* Review Summary Card */
        .review-summary-card {
            margin: 15px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: var(--shadow);
        }
        .summary-header { display: flex; align-items: center; gap: 20px; }
        .avg-box { text-align: center; }
        .avg-box h2 { font-size: 36px; margin: 0; color: var(--primary); }
        .stars-outer { color: #ccc; font-size: 14px; position: relative; display: inline-block; }
        .stars-inner { color: #f97316; position: absolute; top: 0; left: 0; white-space: nowrap; overflow: hidden; }
        .total-rev-text { font-size: 12px; color: #64748b; margin-top: 5px; }
        
        .breakdown-box { flex-grow: 1; }
        .break-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; font-size: 12px; }
        .progress-bg { flex-grow: 1; height: 6px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 10px; transition: width 0.5s ease; }
        .break-label { min-width: 45px; text-align: right; color: #64748b; }

        /* Write Review Button */
        .write-review-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #334155);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Search Section */
        .search-area { padding: 15px; position: sticky; top: 64px; z-index: 99; background: var(--bg); }

            width: 100%; max-width: 800px; margin: 0 auto; display: block; padding: 14px 20px; 
            border-radius: 50px; border: 2px solid #e2e8f0; box-shadow: 0 5px 20px rgba(0,0,0,0.06); 
            outline: none; font-size: 15px; font-family:'Hind Siliguri'; transition:0.3s; background:white;
        }
        .search-bar:focus { border-color: var(--accent); box-shadow: 0 5px 20px rgba(249, 115, 22, 0.2); }

        /* Review Section Wrapper */
        .reviews-section { padding: 15px; max-width: 800px; margin: 0 auto; }
        .reviews-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 8px;}
        
        /* Review List */
        .review-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid #f1f5f9;
            position: relative;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .rev-user { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .rev-user img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #f97316; }
        .rev-user-info h4 { margin: 0; font-size: 14px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 4px; }
        .rev-date { font-size: 11px; color: #94a3b8; }
        .rev-stars { color: #f97316; font-size: 12px; margin-bottom: 8px; }
        .rev-title { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 5px; }
        .rev-msg { font-size: 14px; color: #475569; line-height: 1.5; }
        
        .rev-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; }
        .rev-action-btn { background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: #64748b; font-size: 12px; transition: 0.2s; }
        .rev-action-btn.del:hover { background: #fee2e2; color: #ef4444; }
        .rev-action-btn.edit:hover { background: #e0f2fe; color: #0ea5e9; }

        /* Modal / Popup */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
            z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px;

        .modal-card {

        .star-rating-input i { cursor: pointer; transition: 0.2s; }
        .star-rating-input i.active { color: #f97316; transform: scale(1.2); }

        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #64748b; }
        .form-group input, .form-group textarea {

            font-family: inherit; outline: none; transition: 0.3s;

        .btn-submit { background: var(--accent); color: white; }
        .btn-cancel { background: #f1f5f9; color: #64748b; }

        .grid { display: grid; gap: 12px; padding: 12px; grid-template-columns: repeat(2, 1fr); max-width: 1400px; margin: 0 auto; width: 100%; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); gap:15px; padding:15px; } }
        
        .p-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 3px 12px rgba(0,0,0,0.06); text-decoration: none; color: #333; border:1px solid #f1f5f9; }
        .img-box { position: relative; padding-top: 100%; background: #f8fafc; overflow:hidden; }
        .img-box img { position: absolute; top: 0; width: 100%; height: 100%; object-fit: cover; }
        .p-info { padding: 10px; }
        .p-name { font-size: 13px; font-weight: 600; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 5px; }
        .price-box { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
        .current-price { color: #16A34A; font-size: 16px; font-weight: 700; }
        .old-price { color: #94A3B8; text-decoration: line-through; font-size: 12px; }
        
        .see-more-btn, .load-more-reviews { 
            display: block; width: 180px; margin: 25px auto; padding: 12px; 
            background: white; color: var(--primary); border: 2px solid #e2e8f0; 
            border-radius: 50px; cursor: pointer; font-weight:700; transition: 0.3s;
        }
        .see-more-btn:hover, .load-more-reviews:hover { border-color: var(--accent); color: var(--accent); }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px);
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.08); border-top: 1px solid rgba(0,0,0,0.05);
            z-index: 9999; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #64748b; font-size: 10px; font-weight: 600; width: 25%; }
        .nav-item i { font-size: 20px; margin-bottom: 3px; }
        .nav-item.active { color: var(--accent); }

        .tabs-container {
            display: flex; border-bottom: 1px solid #e2e8f0; margin-top: 10px; padding: 0 15px; gap: 20px;
        }
        .tab-btn {
            padding: 12px 5px; font-weight: 700; font-size: 15px; color: #64748b;
            cursor: pointer; position: relative;
        }
        .tab-btn.active { color: var(--accent); }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; width: 100%;
            height: 3px; background: var(--accent); border-radius: 10px 10px 0 0;
        }
        
        .section-content { display: none; }
        .section-content.active { display: block; }

        .google-verified { color: #1877F2; font-size: 12px; }

        /* WhatsApp Float */
        .wa-float { 
            position: fixed; bottom: 90px; right: 15px; background: #25D366; color: white; 
            width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; font-size: 26px; box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4); 
            z-index: 1000; text-decoration: none; 
        }

        /* Loading Spinner */
        .loader { width: 25px; height: 25px; border: 3px solid #f3f3f3; border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>

        // 1. Get Username from URL
        function getUsernameFromURL(){
            const urlParams = new URLSearchParams(window.location.search);
            let user = urlParams.get("@");
            if(user) return decodeURIComponent(user.trim());
            for(const [key, value] of urlParams.entries()){
                let cleanKey = decodeURIComponent(key.trim());
                if(cleanKey.startsWith('@')) return cleanKey.substring(1);
            }
            const raw = window.location.search;
            if(raw.includes('@') || raw.includes('%40')){
                return decodeURIComponent(raw.replace('?', '').split('&')[0].replace('@','').replace('%40',''));
            }
            return null;
        }

        const username = getUsernameFromURL();

        // 2. Auth State Change
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if(user) {
                // Save/Update user in Firestore
                setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    name: user.displayName,
                    photo: user.photoURL,
                    email: user.email,
                    lastLogin: serverTimestamp()
                }, { merge: true });
            }
        });

        // 3. Load Profile & Products
        async function loadProfile() {
            if (!username) {
                document.getElementById("shopName").innerText = "শপ খুঁজে পাওয়া যায়নি";
                return;
            }

            const userQuery = query(collection(db, "users"), where("username", "==", username), limit(1));
            const userSnap = await getDocs(userQuery);

            if (userSnap.empty) {
                document.getElementById("shopName").innerText = "শপ খুঁজে পাওয়া যায়নি";
                return;
            }

            const docSnap = userSnap.docs[0];
            currentSellerId = docSnap.id;
            currentSellerUsername = username;
            const d = docSnap.data();

            document.getElementById('shopName').innerText = d.shopName;
            document.getElementById('metaTitle').innerText = `${d.shopName} | Ghoti Market`;
            if (d.shopLogo) document.getElementById('shopLogoImg').src = d.shopLogo;
            if (d.shopBanner) {
                document.getElementById('shopBannerImg').src = d.shopBanner;
                document.getElementById('shopBannerImg').style.display = "block";
            }
            if (d.verified) document.getElementById('verifiedBadge').style.display = "flex";
            if (d.phone) document.getElementById('waLink').href = `https://wa.me/88${d.phone}`;

            // Load Initial Data
            loadProducts();
            loadReviews(true);
            updateAverageRating();
        }

        // 4. Products Logic
        async function loadProducts() {
            const productQuery = query(
                collection(db, "products"),
                where("sellerId", "==", currentSellerId),
                where("active", "==", true)
            );
            const productSnap = await getDocs(productQuery);
            allProducts = productSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            filteredProducts = allProducts;
            renderProducts();
        }

        window.handleSearch = () => {
            const term = document.getElementById('pSearch').value.toLowerCase().trim();
            filteredProducts = allProducts.filter(p =>
                p.name?.toLowerCase().includes(term) ||
                (Array.isArray(p.keywords) ? p.keywords.some(k => k.toLowerCase().includes(term)) : p.keywords?.toLowerCase().includes(term))
            );
            productDisplayCount = 20;
            renderProducts();
        };

        window.loadMoreProducts = () => {
            productDisplayCount += 20;
            renderProducts();
        };

        function renderProducts() {
            const grid = document.getElementById('sellerProductGrid');
            const btn = document.getElementById('seeMoreBtn');
            const dataToDisplay = filteredProducts.slice(0, productDisplayCount);

            grid.innerHTML = dataToDisplay.length ? dataToDisplay.map(p => `
                <a href="${p.slug ? `https://ghotimarket.com/product?${p.slug}` : `https://ghotimarket.com/product?id=${p.id}`}" class="p-card">
                    <div class="img-box"><img src="${p.images?.[0] || ''}" alt="${p.name}"></div>
                    <div class="p-info">
                        <div class="p-name">${p.name}</div>
                        <div class="price-box">
                            <span class="current-price">৳${p.price}</span>
                            ${p.oldPrice && Number(p.oldPrice) > Number(p.price) ? `<span class="old-price">৳${p.oldPrice}</span>` : ""}
                        </div>
                    </div>
                </a>
            `).join('') : '<p style="text-align:center; grid-column:1/-1; padding:40px;">😔 কোনো পণ্য পাওয়া যায়নি!</p>';

            btn.style.display = (productDisplayCount < filteredProducts.length) ? 'block' : 'none';
        }

        // 5. Review Logic
        window.openReviewModal = async (editId = null, existingData = null) => {
            if(!currentUser) {
                try {
                    await signInWithPopup(auth, provider);
                } catch (e) { alert("লগইন করতে সমস্যা হয়েছে!"); return; }
            }

            // Check if already reviewed (if not editing)
            if(!editId) {
                const q = query(collection(db, "reviews"), where("sellerId", "==", currentSellerId), where("userUid", "==", currentUser.uid));
                const snap = await getDocs(q);
                if(!snap.empty) {
                    alert("আপনি ইতোমধ্যে এই শপে রিভিউ দিয়েছেন। আপনি চাইলে আপনার আগের রিভিউটি এডিট করতে পারেন।");
                    return;
                }
            }

            const modal = document.getElementById('reviewModal');
            modal.style.display = 'flex';
            
            if(editId && existingData) {
                document.getElementById('modalTitle').innerText = "রিভিউ এডিট করুন";
                document.getElementById('editingReviewId').value = editId;
                document.getElementById('revTitle').value = existingData.title;
                document.getElementById('revMessage').value = existingData.message;
                setStarRating(existingData.rating);
            } else {
                document.getElementById('modalTitle').innerText = "আপনার মতামত দিন";
                document.getElementById('editingReviewId').value = "";
                document.getElementById('revTitle').value = "";
                document.getElementById('revMessage').value = "";
                setStarRating(0);
            }
        };

        window.closeReviewModal = () => {
            document.getElementById('reviewModal').style.display = 'none';
        };

        // Star Selection UI
        document.querySelectorAll('#starInput i').forEach(star => {
            star.addEventListener('click', () => {
                const val = parseInt(star.getAttribute('data-val'));
                setStarRating(val);
            });
        });

        function setStarRating(val) {
            document.getElementById('selectedRating').value = val;
            document.querySelectorAll('#starInput i').forEach(s => {
                const sVal = parseInt(s.getAttribute('data-val'));
                s.classList.toggle('active', sVal <= val);
                s.classList.toggle('fas', sVal <= val);
                s.classList.toggle('far', sVal > val);
            });
        }

        window.submitReview = async () => {
            const rating = parseInt(document.getElementById('selectedRating').value);
            const title = document.getElementById('revTitle').value.trim();
            const message = document.getElementById('revMessage').value.trim();
            const editId = document.getElementById('editingReviewId').value;

            if(rating === 0) return alert("দয়া করে স্টার রেটিং সিলেক্ট করুন!");
            if(message.length < 10) return alert("রিভিউ কমপক্ষে ১০ অক্ষরের হতে হবে!");

            const btn = document.getElementById('submitReviewBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span>';

            const reviewData = {
                sellerId: currentSellerId,
                sellerUsername: currentSellerUsername,
                rating: rating,
                title: title,
                message: message,
                userUid: currentUser.uid,
                userName: currentUser.displayName,
                userPhoto: currentUser.photoURL,
                updatedAt: serverTimestamp()
            };

            try {
                if(editId) {
                    await updateDoc(doc(db, "reviews", editId), reviewData);
                } else {
                    reviewData.createdAt = serverTimestamp();
                    await addDoc(collection(db, "reviews"), reviewData);
                }
                closeReviewModal();
                loadReviews(true);
                updateAverageRating();
                alert("রিভিউ সফলভাবে জমা হয়েছে!");
            } catch (e) {
                alert("ত্রুটি: রিভিউ সেভ করা যায়নি।");
            } finally {
                btn.disabled = false;
                btn.innerText = "রিভিউ জমা দিন";
            }
        };

        async function loadReviews(reset = false) {
            if(isReviewsLoading) return;
            isReviewsLoading = true;

            const listDiv = document.getElementById('reviewsList');
            const loadBtn = document.getElementById('loadMoreReviewsBtn');

            if(reset) {
                listDiv.innerHTML = '<p style="text-align:center; padding:20px;"><span class="loader"></span></p>';
                lastReviewDoc = null;
            }

            let q;
            if(lastReviewDoc) {
                q = query(collection(db, "reviews"), where("sellerId", "==", currentSellerId), orderBy("createdAt", "desc"), startAfter(lastReviewDoc), limit(REVIEW_LIMIT));
            } else {
                q = query(collection(db, "reviews"), where("sellerId", "==", currentSellerId), orderBy("createdAt", "desc"), limit(REVIEW_LIMIT));
            }

            const snap = await getDocs(q);
            if(reset) listDiv.innerHTML = "";

            if(snap.empty && reset) {
                listDiv.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">এখনো কোনো রিভিউ নেই। প্রথম রিভিউটি আপনি দিন!</p>';
                loadBtn.style.display = "none";
            } else {
                snap.forEach(doc => {
                    const r = doc.data();
                    const date = r.createdAt?.toDate() ? r.createdAt.toDate().toLocaleDateString('bn-BD') : 'সদ্য';
                    const isOwn = currentUser && currentUser.uid === r.userUid;
                    
                    const card = document.createElement('div');
                    card.className = 'review-card';
                    card.innerHTML = `
                        <div class="rev-user">
                            <img src="${r.userPhoto || 'https://www.w3schools.com/howto/img_avatar.png'}" alt="User">
                            <div class="rev-user-info">
                                <h4>${r.userName} <i class="fas fa-check-circle google-verified" title="Google Verified"></i></h4>
                                <div class="rev-date">${date}</div>
                            </div>
                        </div>
                        <div class="rev-stars">${'<i class="fas fa-star"></i>'.repeat(r.rating)}${'<i class="far fa-star"></i>'.repeat(5-r.rating)}</div>
                        <div class="rev-title">${r.title}</div>
                        <div class="rev-msg">${r.message}</div>
                        ${isOwn ? `
                            <div class="rev-actions">
                                <button class="rev-action-btn edit" onclick='openReviewModal("${doc.id}", ${JSON.stringify(r).replace(/'/g, "&apos;")})'><i class="fas fa-edit"></i></button>
                                <button class="rev-action-btn del" onclick="deleteReview('${doc.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        ` : ''}
                    `;
                    listDiv.appendChild(card);
                });

                lastReviewDoc = snap.docs[snap.docs.length - 1];
                loadBtn.style.display = snap.docs.length === REVIEW_LIMIT ? "block" : "none";
            }
            isReviewsLoading = false;
        }

        window.loadMoreReviews = () => loadReviews(false);

        window.deleteReview = async (id) => {
            if(confirm("আপনি কি নিশ্চিতভাবে এই রিভিউটি ডিলিট করতে চান?")) {
                await deleteDoc(doc(db, "reviews", id));
                loadReviews(true);
                updateAverageRating();
            }
        };

        // 6. Aggregate Rating Calculation
        async function updateAverageRating() {
            const q = query(collection(db, "reviews"), where("sellerId", "==", currentSellerId));
            const snap = await getDocs(q);
            
            let totalRating = 0;
            let count = snap.size;
            let breakdown = { 5:0, 4:0, 3:0, 2:0, 1:0 };

            snap.forEach(d => {
                const r = d.data().rating;
                totalRating += r;
                breakdown[r]++;
            });

            const avg = count > 0 ? (totalRating / count).toFixed(1) : "0.0";
            
            document.getElementById('avgRatingText').innerText = avg;
            document.getElementById('avgStarsFill').style.width = `${(avg / 5) * 100}%`;
            document.getElementById('totalReviewsCount').innerText = `${count} রিভিউ`;

            const breakdownDivs = document.getElementById('ratingBreakdown').querySelectorAll('.break-row');
            [5,4,3,2,1].forEach((num, index) => {
                const percent = count > 0 ? (breakdown[num] / count) * 100 : 0;
                breakdownDivs[index].querySelector('.progress-fill').style.width = `${percent}%`;
                breakdownDivs[index].querySelector('.break-count').innerText = breakdown[num];
            });
        }

        // Tab Switcher
        window.switchTab = (target, btn) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            
            btn.classList.add('active');
            document.getElementById(`${target}-section`).classList.add('active');
        };

        // Initial Load
        loadProfile();

    </script>
</body>
</html>
