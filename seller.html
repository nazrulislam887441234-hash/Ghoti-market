<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="metaTitle">Seller Profile | Ghoti Market</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/RG2hrf3y/background-remove-ghoti-market.png">
    <meta name="theme-color" content="#f97316">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&display=swap');
        :root { --primary: #0f172a; --bg: #f8fafc; --accent: #f97316; --accent2: #fb923c; --danger: #ff4757; --glass: rgba(255,255,255,0.85); --glass-border: rgba(255, 255, 255, 0.5); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Hind Siliguri', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); margin: 0; padding-bottom: 90px; overflow-x: hidden; }
        
        .native-bar { position: sticky; top: 0; z-index: 1000; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); padding: 12px 15px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .back-btn { background: rgba(255,255,255,0.1); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.3s; }
        
        .profile-container { background: var(--glass); backdrop-filter: blur(15px); border-radius: 0 0 30px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--glass-border); padding-bottom: 20px; }
        .banner-box { position: relative; width: 100%; padding-top: 40%; background: #cbd5e1; overflow: hidden; }
        .banner-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .profile-info { text-align: center; margin-top: -45px; position: relative; z-index: 2; padding: 0 15px; }
        .shop-logo { width: 90px; height: 90px; background: white; border-radius: 50%; margin: 0 auto 12px; border: 4px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .shop-logo img { width: 100%; height: 100%; object-fit: cover; }
        .shop-name-area { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .shop-name-area h1 { font-size: 22px; margin: 0; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .verified-badge { width: 18px; height: 18px; background: #1877F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; }

        .summary-card { margin: 15px; background: rgba(255,255,255,0.7); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
        .summary-grid { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .avg-rating { text-align: center; }
        .avg-rating h2 { font-size: 42px; margin: 0; color: var(--primary); }
        .stars-row { color: #f97316; font-size: 14px; margin: 5px 0; }
        .total-rev { font-size: 12px; color: #64748b; }
        
        .breakdown { flex: 1; }
        .break-item { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; font-size: 11px; color: #64748b; }
        .progress { flex: 1; height: 6px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .bar { height: 100%; background: var(--accent); border-radius: 10px; width: 0%; transition: 0.5s; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn-p { padding: 14px; border: none; border-radius: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; }
        .btn-write { background: var(--primary); color: white; }
        .btn-write:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-view-all { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; box-shadow: 0 8px 20px rgba(249,115,22,0.3); }

        .search-area { padding: 15px; position: sticky; top: 64px; z-index: 99; background: var(--bg); }
        .search-bar { width: 100%; padding: 14px 20px; border-radius: 50px; border: 2px solid #e2e8f0; outline: none; font-family: inherit; transition: 0.3s; }
        .search-bar:focus { border-color: var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        .p-card { background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-decoration: none; color: inherit; border: 1px solid #f1f5f9; transition: 0.2s; position: relative;}
        .img-box { padding-top: 100%; position: relative; background: #f8fafc; }
        .img-box img { position: absolute; top:0; width:100%; height:100%; object-fit: cover; }
        
        .p-info { padding: 12px; }
        .p-name { font-size: 13px; font-weight: 600; height: 38px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 5px;}
        .p-pricing { display: flex; flex-direction: column; gap: 2px; }
        .price-row { display: flex; align-items: center; gap: 8px; }
        .curr-price { color: #16a34a; font-weight: 800; font-size: 16px; }
        .old-price { color: #94a3b8; text-decoration: line-through; font-size: 12px; }
        .save-tag { font-size: 11px; color: #ef4444; font-weight: 700; background: #fee2e2; padding: 2px 8px; border-radius: 20px; display: inline-block; width: fit-content;}
        .discount-badge { position: absolute; top: 10px; left: 10px; background: #f97316; color: white; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 8px; z-index: 5;}

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 450px; border-radius: 25px; padding: 25px; animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto;}
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .star-input { display: flex; gap: 10px; justify-content: center; margin: 20px 0; font-size: 30px; color: #e2e8f0; }
        .star-input i { cursor: pointer; transition: 0.2s; }
        .star-input i.active { color: #f97316; transform: scale(1.1); }
        .form-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px; font-family: inherit; font-size: 14px; outline: none;}
        .form-input:focus { border-color: var(--accent); }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; text-decoration: none; font-size: 11px; font-weight: 600; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="native-bar">
        <a href="https://ghotimarket.com" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    </div>

    <div class="profile-container">
        <div class="banner-box"><img id="shopBanner" src="" alt=""></div>
        <div class="profile-info">
            <div class="shop-logo"><img id="shopLogo" src="https://i.ibb.co/RG2hrf3y/background-remove-ghoti-market.png" alt=""></div>
            <div class="shop-name-area">
                <h1 id="shopName">লোড হচ্ছে...</h1>
                <div id="verifiedBadge" class="verified-badge" style="display:none;"><i class="fas fa-check"></i></div>
            </div>

            <div class="summary-card">
                <div class="summary-grid">
                    <div class="avg-rating">
                        <h2 id="avgRating">0.0</h2>
                        <div class="stars-row" id="avgStars"></div>
                        <div class="total-rev" id="totalReviews">0 রিভিউ</div>
                    </div>
                    <div class="breakdown" id="ratingBreakdown">
                        <!-- Progress bars will be injected here -->
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn-p btn-write" id="reviewTriggerBtn">
                        <i class="fas fa-pen"></i> একটি রিভিউ লিখুন
                    </button>
                    <button class="btn-p btn-view-all" id="viewAllReviewsBtn">
                        <i class="fas fa-comments"></i> কাস্টমার রিভিউ দেখুন
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="search-area">
        <input type="text" id="pSearch" class="search-bar" placeholder="এই শপের পণ্য খুঁজুন...">
    </div>

    <div class="grid" id="productGrid">
        <!-- Products will be injected here -->
    </div>

    <!-- Review Modal -->
    <div class="modal" id="reviewModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="text-align:center; margin-top:0;">রিভিউ দিন</h3>
            <div class="star-input" id="starInput">
                <i class="fas fa-star" data-v="1"></i>
                <i class="fas fa-star" data-v="2"></i>
                <i class="fas fa-star" data-v="3"></i>
                <i class="fas fa-star" data-v="4"></i>
                <i class="fas fa-star" data-v="5"></i>
            </div>
            <input type="text" id="revTitle" class="form-input" placeholder="রিভিউ টাইটেল (যেমন: দারুণ পণ্য)">
            <textarea id="revMsg" class="form-input" rows="4" placeholder="আপনার মতামত বিস্তারিত লিখুন (কমপক্ষে ১০ অক্ষর)"></textarea>
            <div style="display:flex; gap:10px;">
                <button class="btn-p btn-write" style="flex:1; background:#f1f5f9; color:#64748b;" id="cancelBtn">বাতিল</button>
                <button class="btn-p btn-view-all" style="flex:1;" id="submitReviewBtn">জমা দিন</button>
            </div>
            <div id="deleteBtnContainer" style="margin-top:10px;"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="https://ghotimarket.com" class="nav-item active"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
        <a href="#" class="nav-item"><i class="fas fa-user-plus"></i><span>Join</span></a>
        <a href="#" class="nav-item"><i class="fas fa-shield-alt"></i><span>Privacy</span></a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, setDoc, addDoc, deleteDoc, updateDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", projectId: "ghotimarket" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentSellerId = null;
        let currentUser = null;
        let selectedRating = 0;
        let existingReviewId = null;
        let allProducts = [];
        let autoOpenModal = false;

        // URL Parsing
        const urlParams = new URLSearchParams(window.location.search);
        let username = "";
        for(let [key, val] of urlParams.entries()) { if(key.startsWith('@')) username = key.substring(1); }
        if(!username) username = urlParams.get('username');

        // Elements
        const elements = {
            shopName: document.getElementById('shopName'),
            shopLogo: document.getElementById('shopLogo'),
            shopBanner: document.getElementById('shopBanner'),
            verifiedBadge: document.getElementById('verifiedBadge'),
            productGrid: document.getElementById('productGrid'),
            avgRating: document.getElementById('avgRating'),
            totalReviews: document.getElementById('totalReviews'),
            avgStars: document.getElementById('avgStars'),
            ratingBreakdown: document.getElementById('ratingBreakdown'),
            reviewModal: document.getElementById('reviewModal'),
            modalTitle: document.getElementById('modalTitle'),
            revTitle: document.getElementById('revTitle'),
            revMsg: document.getElementById('revMsg'),
            starIcons: document.querySelectorAll('#starInput i'),
            submitReviewBtn: document.getElementById('submitReviewBtn'),
            reviewTriggerBtn: document.getElementById('reviewTriggerBtn'),
            deleteBtnContainer: document.getElementById('deleteBtnContainer'),
            cancelBtn: document.getElementById('cancelBtn'),
            pSearch: document.getElementById('pSearch'),
            viewAllBtn: document.getElementById('viewAllReviewsBtn')
        };

        // Initialize App
        async function init() {
            if(!username) {
                elements.shopName.innerText = "শপ ইউজারনেম পাওয়া যায়নি";
                return;
            }

            try {
                const q = query(collection(db, "users"), where("username", "==", username));
                const snap = await getDocs(q);
                if(snap.empty) {
                    elements.shopName.innerText = "শপ খুঁজে পাওয়া যায়নি";
                    return;
                }
                
                const seller = snap.docs[0].data();
                currentSellerId = snap.docs[0].id;

                elements.shopName.innerText = seller.shopName;
                document.getElementById('metaTitle').innerText = `${seller.shopName} | Ghoti Market`;
                if(seller.shopLogo) elements.shopLogo.src = seller.shopLogo;
                if(seller.shopBanner) {
                    elements.shopBanner.src = seller.shopBanner;
                    elements.shopBanner.style.display = 'block';
                }
                if(seller.verified) elements.verifiedBadge.style.display = 'flex';

                elements.viewAllBtn.onclick = () => {
                    window.location.href = `seller-review.html?@${username}`;
                };

                loadProducts();
                listenToStats();
            } catch (error) {
                console.error("Init Error:", error);
            }
        }

        // Auth Listener
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if(user && autoOpenModal) {
                autoOpenModal = false;
                handleOpenModal();
            }
        });

        // Rating Stats (Realtime)
        function listenToStats() {
            const q = query(collection(db, "reviews"), where("sellerId", "==", currentSellerId));
            onSnapshot(q, (snap) => {
                let total = snap.size;
                let sum = 0;
                let counts = {5:0, 4:0, 3:0, 2:0, 1:0};
                
                snap.forEach(d => {
                    const r = d.data().rating;
                    sum += r;
                    counts[r]++;
                });

                const avg = total > 0 ? (sum/total).toFixed(1) : "0.0";
                elements.avgRating.innerText = avg;
                elements.totalReviews.innerText = `${total} রিভিউ`;
                
                let starsHtml = "";
                for(let i=1; i<=5; i++) {
                    starsHtml += `<i class="${i <= Math.round(avg) ? 'fas' : 'far'} fa-star"></i>`;
                }
                elements.avgStars.innerHTML = starsHtml;

                let breakHtml = "";
                [5,4,3,2,1].forEach(num => {
                    let perc = total > 0 ? (counts[num]/total)*100 : 0;
                    breakHtml += `
                        <div class="break-item">
                            <span>${num}★</span>
                            <div class="progress"><div class="bar" style="width:${perc}%"></div></div>
                            <span>${counts[num]}</span>
                        </div>
                    `;
                });
                elements.ratingBreakdown.innerHTML = breakHtml;
            });
        }

        // Product Loading
        async function loadProducts() {
            try {
                const q = query(collection(db, "products"), where("sellerId", "==", currentSellerId), where("active", "==", true));
                const snap = await getDocs(q);
                allProducts = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderGrid(allProducts);
            } catch (error) {
                console.error("Products Load Error:", error);
            }
        }

        function renderGrid(list) {
            elements.productGrid.innerHTML = list.map(p => {
                const hasDiscount = p.oldPrice && p.oldPrice > p.price;
                const discountPercent = hasDiscount ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100) : 0;
                const savedAmount = hasDiscount ? p.oldPrice - p.price : 0;

                return `
                <a href="product.html?id=${p.id}" class="p-card">
                    ${hasDiscount ? `<div class="discount-badge">${discountPercent}% OFF</div>` : ''}
                    <div class="img-box"><img src="${p.images?.[0] || 'https://i.ibb.co/6P0x9Yy/no-image.png'}"></div>
                    <div class="p-info">
                        <div class="p-name">${p.name}</div>
                        <div class="p-pricing">
                            <div class="price-row">
                                <span class="curr-price">৳${p.price}</span>
                                ${hasDiscount ? `<span class="old-price">৳${p.oldPrice}</span>` : ''}
                            </div>
                            ${hasDiscount ? `<div class="save-tag">You Save ৳${savedAmount}</div>` : ''}
                        </div>
                    </div>
                </a>
                `;
            }).join('') || '<p style="text-align:center; grid-column: 1/-1; padding: 20px; color: #64748b;">কোনো পণ্য পাওয়া যায়নি।</p>';
        }

        // Search
        elements.pSearch.oninput = () => {
            const term = elements.pSearch.value.toLowerCase().trim();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(term));
            renderGrid(filtered);
        };

        // Modal Handling
        elements.reviewTriggerBtn.onclick = () => {
            if(!currentUser) {
                autoOpenModal = true;
                signInWithPopup(auth, provider).catch(err => {
                    console.error("Login Error", err);
                    autoOpenModal = false;
                });
            } else {
                handleOpenModal();
            }
        };

        async function handleOpenModal() {
            try {
                // Check if user already reviewed
                const q = query(collection(db, "reviews"), where("sellerId", "==", currentSellerId), where("userUid", "==", currentUser.uid));
                const snap = await getDocs(q);
                
                elements.reviewModal.style.display = 'flex';
                const isAdmin = currentUser.email === 'support@ghotimarket.com';
                
                if(!snap.empty) {
                    const data = snap.docs[0].data();
                    existingReviewId = snap.docs[0].id;
                    elements.modalTitle.innerText = "আপনার রিভিউ আপডেট করুন";
                    elements.revTitle.value = data.title;
                    elements.revMsg.value = data.message;
                    updateStarUI(data.rating);
                    elements.deleteBtnContainer.innerHTML = `<button class="btn-p" style="width:100%; background:#fee2e2; color:#ef4444;" id="deleteReviewBtn"><i class="fas fa-trash"></i> রিভিউ ডিলিট করুন</button>`;
                    document.getElementById('deleteReviewBtn').onclick = () => handleDeleteReview(existingReviewId);
                } else {
                    existingReviewId = null;
                    elements.modalTitle.innerText = "আপনার মতামত দিন";
                    elements.revTitle.value = "";
                    elements.revMsg.value = "";
                    updateStarUI(0);
                    elements.deleteBtnContainer.innerHTML = "";
                }
            } catch (err) {
                console.error("Modal Data Load Error", err);
            }
        }

        elements.cancelBtn.onclick = () => elements.reviewModal.style.display = 'none';

        // Star UI Interaction
        elements.starIcons.forEach(star => {
            star.onclick = () => updateStarUI(parseInt(star.dataset.v));
        });

        function updateStarUI(v) {
            selectedRating = v;
            elements.starIcons.forEach(s => {
                const sVal = parseInt(s.dataset.v);
                if(sVal <= v) {
                    s.classList.add('fas', 'active');
                    s.classList.remove('far');
                } else {
                    s.classList.remove('fas', 'active');
                    s.classList.add('far');
                }
            });
        }

        // CRUD Actions
        elements.submitReviewBtn.onclick = async () => {
            const title = elements.revTitle.value.trim();
            const msg = elements.revMsg.value.trim();

            if(selectedRating === 0) return alert("দয়া করে একটি রেটিং দিন!");
            if(msg.length < 10) return alert("মতামত কমপক্ষে ১০ অক্ষরের হতে হবে!");

            elements.submitReviewBtn.disabled = true;
            elements.submitReviewBtn.innerText = "অপেক্ষা করুন...";

            const reviewData = {
                sellerId: currentSellerId,
                sellerUsername: username,
                userUid: currentUser.uid,
                userName: currentUser.displayName,
                userPhoto: currentUser.photoURL,
                rating: selectedRating,
                title: title,
                message: msg,
                updatedAt: serverTimestamp()
            };

            try {
                if(existingReviewId) {
                    await updateDoc(doc(db, "reviews", existingReviewId), reviewData);
                    alert("রিভিউ আপডেট করা হয়েছে!");
                } else {
                    reviewData.createdAt = serverTimestamp();
                    await addDoc(collection(db, "reviews"), reviewData);
                    alert("রিভিউ সফলভাবে জমা হয়েছে!");
                }
                elements.reviewModal.style.display = 'none';
            } catch (err) {
                alert("দুঃখিত, রিভিউ সেভ করা যায়নি। আবার চেষ্টা করুন।");
                console.error("Save Error", err);
            } finally {
                elements.submitReviewBtn.disabled = false;
                elements.submitReviewBtn.innerText = "জমা দিন";
            }
        };

        async function handleDeleteReview(id) {
            if(confirm("আপনি কি নিশ্চিতভাবে এই রিভিউটি ডিলিট করতে চান?")) {
                try {
                    await deleteDoc(doc(db, "reviews", id));
                    alert("রিভিউ ডিলিট করা হয়েছে!");
                    elements.reviewModal.style.display = 'none';
                } catch (err) {
                    alert("ডিলিট করা যায়নি!");
                    console.error("Delete Error", err);
                }
            }
        }

        // Run
        init();
    </script>
</body>
</html>
