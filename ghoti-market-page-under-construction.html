<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B35">
  <title>পৃষ্ঠা তৈরির কাজ চলছে | GHOTI MARKET</title>
  <style>
    :root{
      --primary:#FF6B35;
      --orange:#FFA500;
      --dark:#0f172a;
      --muted:#64748b;
      --bg:#fff8f3;
      --white:#fff;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    html,body{min-height:100%}

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
      color:var(--dark);
      background:
        radial-gradient(circle at 15% 15%, rgba(255,107,53,.16), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(255,165,0,.14), transparent 30%),
        var(--bg);
      overflow:hidden;
    }

    .page{
      width:min(100%,760px);
      position:relative;
      text-align:center;
      padding:48px 28px;
      border:1px solid rgba(255,107,53,.16);
      border-radius:30px;
      background:rgba(255,255,255,.88);
      box-shadow:0 24px 70px rgba(15,23,42,.10);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .brand{
      display:inline-flex;
      align-items:center;
      gap:10px;
      margin-bottom:28px;
      font-weight:900;
      font-size:18px;
      letter-spacing:.5px;
      color:var(--primary);
    }

    .brand-mark{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border-radius:13px;
      color:#fff;
      background:linear-gradient(135deg,var(--primary),var(--orange));
      box-shadow:0 10px 25px rgba(255,107,53,.28);
      font-size:20px;
    }

    .icon-wrap{
      width:116px;
      height:116px;
      margin:0 auto 28px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:linear-gradient(135deg,#fff0e6,#fff8f3);
      border:8px solid #fff;
      box-shadow:0 15px 35px rgba(255,107,53,.16);
      position:relative;
    }

    .icon{
      font-size:52px;
      animation:float 2.6s ease-in-out infinite;
    }

    .icon-wrap::after{
      content:"";
      position:absolute;
      inset:-12px;
      border:2px dashed rgba(255,107,53,.25);
      border-radius:50%;
      animation:spin 12s linear infinite;
    }

    h1{
      font-size:clamp(28px,6vw,48px);
      line-height:1.2;
      font-weight:900;
      margin-bottom:14px;
      background:linear-gradient(135deg,var(--primary),#e85a1a);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .subtitle{
      max-width:560px;
      margin:0 auto;
      color:var(--muted);
      font-size:clamp(15px,3vw,18px);
      line-height:1.8;
    }

    .progress{
      width:min(100%,430px);
      height:9px;
      margin:30px auto 12px;
      overflow:hidden;
      border-radius:20px;
      background:#ffe8dc;
    }

    .progress span{
      display:block;
      width:42%;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,var(--primary),var(--orange));
      animation:progress 2.2s ease-in-out infinite;
    }

    .status{
      color:#94a3b8;
      font-size:13px;
      font-weight:700;
    }

    .back{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      margin-top:28px;
      padding:12px 22px;
      border-radius:999px;
      color:#fff;
      background:linear-gradient(135deg,var(--primary),var(--orange));
      text-decoration:none;
      font-weight:800;
      box-shadow:0 10px 24px rgba(255,107,53,.22);
      transition:transform .2s ease,box-shadow .2s ease;
    }

    .back:hover{
      transform:translateY(-2px);
      box-shadow:0 14px 30px rgba(255,107,53,.30);
    }

    .dots{
      display:flex;
      justify-content:center;
      gap:7px;
      margin-top:24px;
    }

    .dots span{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#ffd1bd;
      animation:bounce 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2){animation-delay:.15s}
    .dots span:nth-child(3){animation-delay:.3s}

    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-8px)}
    }

    @keyframes spin{to{transform:rotate(360deg)}}

    @keyframes progress{
      0%{transform:translateX(-110%)}
      50%{transform:translateX(110%)}
      100%{transform:translateX(250%)}
    }

    @keyframes bounce{
      0%,80%,100%{transform:scale(.65);opacity:.45}
      40%{transform:scale(1);opacity:1}
    }

    @media (max-width:480px){
      body{padding:15px}
      .page{padding:38px 20px;border-radius:24px}
      .icon-wrap{width:96px;height:96px}
      .icon{font-size:44px}
      .brand{margin-bottom:22px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation:none!important;
        scroll-behavior:auto!important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand">
      <span class="brand-mark">🛠️</span>
      <span>GHOTI MARKET</span>
    </div>

    <div class="icon-wrap" aria-hidden="true">
      <div class="icon">🚧</div>
    </div>

    <h1>এই পেজটি তৈরির কাজ চলছে........</h1>

    <p class="subtitle">
      আমরা এই পেজটি আরও সুন্দর ও উন্নত করার জন্য কাজ করছি।
      খুব শীঘ্রই নতুন পেজটি আপনার জন্য প্রস্তুত হবে।
    </p>

    <div class="progress" aria-hidden="true">
      <span></span>
    </div>

    <div class="status">Please wait • Coming Soon</div>

    <div class="dots" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <a class="back" href="https://ghotimarket.com">
      ← হোম পেজে ফিরে যান
    </a>
  </main>
</body>
</html>
