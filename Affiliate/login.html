<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOTI MARKET - Affiliate Login</title>
    
    <!-- Google Fonts: Hind Siliguri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #FF6A00;
            --primary-hover: #e55e00;
            --bg-color: #FFF8F3;
            --card-bg: #FFFFFF;
            --text-main: #2D3748;
            --text-muted: #718096;
            --border-color: #E2E8F0;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(255, 106, 0, 0.08), 0 8px 10px -6px rgba(255, 106, 0, 0.04);
            --success: #10B981;
            --error: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: auto;
            padding: 10px 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px 24px;
            width: 100%;
            border: 1px solid rgba(255, 106, 0, 0.05);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-area img {
            max-width: 150px;
            width: 100%;
            height: auto;
            display: inline-block;
        }

        .header-title {
            text-align: center;
            margin-bottom: 24px;
        }

        .header-title h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .header-title p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.field-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px 12px 42px;
            font-size: 15px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #FAFAFA;
        }

        .form-control:focus {
            border-color: var(--primary);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.12);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 16px;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .form-row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .remember-me input {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(255, 106, 0, 0.25);
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider::before {
            margin-right: .75em;
        }

        .divider::after {
            margin-left: .75em;
        }

        .btn-outline {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: var(--primary);
            border: 1.5px solid var(--primary);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-outline:hover {
            background-color: rgba(255, 106, 0, 0.05);
        }

        .extra-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }

        .extra-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Popup Notification Modal */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-card {
            background: #FFFFFF;
            padding: 24px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 360px;
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .popup-overlay.active .popup-card {
            transform: translateY(0);
        }

        .popup-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 24px;
        }

        .popup-icon.success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .popup-icon.error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .popup-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .popup-message {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            white-space: pre-line;
            text-align: left;
        }

        .popup-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            color: #FFFFFF;
            width: 100%;
        }

        .popup-btn.success {
            background-color: var(--success);
        }

        .popup-btn.error {
            background-color: var(--error);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Logo -->
            <div class="logo-area">
                <img src="https://ghotimarket.com/logo.png" alt="GHOTI MARKET" onerror="this.style.display='none';">
            </div>

            <!-- Title & Subtitle -->
            <div class="header-title">
                <h2>Affiliate Login</h2>
                <p>আপনার অ্যাফিলিয়েট অ্যাকাউন্টে প্রবেশ করুন</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">ইমেইল ঠিকানা</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope field-icon"></i>
                        <input type="email" id="email" class="form-control" placeholder="example@domain.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">পাসওয়ার্ড</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" id="password" class="form-control" placeholder="পাসওয়ার্ড লিখুন" required autocomplete="current-password">
                        <i class="fa-regular fa-eye password-toggle" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-row-between">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe"> মনে রাখুন
                    </label>
                    <a href="https://seller.ghotimarket.com/forgot-password" class="forgot-link">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">
                    <span id="btnText">লগইন করুন</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>

                <div class="divider">অথবা</div>

                <a href="https://ghotimarket.com/Affiliate/register.html" class="btn-outline">অ্যাকাউন্ট তৈরি করুন</a>
            </form>

            <div class="extra-links">
                <p>অ্যাফিলিয়েট অ্যাকাউন্ট নেই? <a href="https://ghotimarket.com/Affiliate/register.html">রেজিস্ট্রেশন করুন</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        © GHOTI MARKET Affiliate Program
    </footer>

    <!-- Custom Popup Modal -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-card">
            <div class="popup-icon" id="popupIcon">
                <i id="popupIconSymbol" class="fa-solid"></i>
            </div>
            <div class="popup-title" id="popupTitle">সফল হয়েছে</div>
            <div class="popup-message" id="popupMessage">সফলভাবে সম্পন্ন হয়েছে।</div>
            <button class="popup-btn" id="popupBtn" onclick="closePopup()">ঠিক আছে</button>
        </div>
    </div>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword,
            signOut,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        console.log("Initializing Firebase...");
        const firebaseConfig = {
            apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",
            authDomain: "ghotimarket.firebaseapp.com",
            projectId: "ghotimarket",
            storageBucket: "ghotimarket.appspot.com",
            messagingSenderId: "9382019283",
            appId: "1:9382019283:web:abc12345"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        console.log("Firebase Initialized");

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const togglePassword = document.getElementById('togglePassword');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        // Popup Elements
        const popupOverlay = document.getElementById('popupOverlay');
        const popupIcon = document.getElementById('popupIcon');
        const popupIconSymbol = document.getElementById('popupIconSymbol');
        const popupTitle = document.getElementById('popupTitle');
        const popupMessage = document.getElementById('popupMessage');
        const popupBtn = document.getElementById('popupBtn');

        // Toggle Password Visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });

        // Show Popup Helper Function
        window.showPopup = function(title, message, type = 'success', callback = null) {
            popupTitle.textContent = title;
            popupMessage.textContent = message;
            
            popupIcon.className = `popup-icon ${type}`;
            popupBtn.className = `popup-btn ${type}`;
            
            if (type === 'success') {
                popupIconSymbol.className = "fa-solid fa-check";
            } else {
                popupIconSymbol.className = "fa-solid fa-triangle-exclamation";
            }

            popupOverlay.classList.add('active');
            window.currentPopupCallback = callback;
        }

        window.closePopup = function() {
            popupOverlay.classList.remove('active');
            if (typeof window.currentPopupCallback === 'function') {
                window.currentPopupCallback();
                window.currentPopupCallback = null;
            }
        }

        // Set Loading State
        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                btnText.style.display = 'none';
                btnSpinner.style.display = 'inline-block';
            } else {
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnSpinner.style.display = 'none';
            }
        }

        // Handle Form Submit
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (submitBtn.disabled) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const rememberMe = rememberMeCheckbox.checked;

            setLoading(true);

            try {
                // Set Auth Persistence based on Remember Me
                const persistenceType = rememberMe ? browserLocalPersistence : browserSessionPersistence;
                await setPersistence(auth, persistenceType);

                console.log("Trying Login...");
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                console.log("Login Success");
                console.log("User UID:", user.uid);

                console.log("Reading Firestore...");
                const docRef = doc(db, "Affiliates", user.uid);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    console.log("Document Not Found");
                    await signOut(auth);
                    showPopup("Login Failed", "This account is not an Affiliate.", "error");
                    return;
                }

                console.log("Document Found");
                const affiliateData = docSnap.data();

                if (affiliateData.active === false) {
                    console.log("Account Disabled");
                    await signOut(auth);
                    showPopup("Login Failed", "Affiliate account has been disabled.", "error");
                    return;
                }

                console.log("Account Active");
                showPopup("সফল", "অ্যাফিলিয়েট লগইন সফল হয়েছে।", "success", () => {
                    console.log("Redirecting...");
                    window.location.replace("https://www.ghotimarket.com/Affiliate/home");
                });

            } catch (error) {
                console.error(error);
                const errCode = error.code || "unknown/error";
                const errMsg = error.message || "Unknown error occurred.";
                
                const formattedMessage = `Error Code:\n${errCode}\n\nError Message:\n${errMsg}`;
                showPopup("Login Failed", formattedMessage, "error");
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
