<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>GHOTI MARKET</title>
    <meta name="robots" content="noindex, nofollow">
    <style>html,body{display:none !important; background:#fff;}</style>
    <script>
      (function() {
        var host = window.location.hostname;
        var path = window.location.pathname;
        if ((host === 'ghotimarket.com' || host === 'www.ghotimarket.com') && path.startsWith('/landing')) {
          var newPath = path.replace(/^\/landing/, '') || '/';
          var newUrl = 'https://landing.ghotimarket.com' + newPath + window.location.search + window.location.hash;
          window.location.replace(newUrl);
        } else {
          // যদি /landing না হয়, তাহলে পেজটা দেখাও
          document.documentElement.style.display = 'block';
          document.addEventListener('DOMContentLoaded', function(){
            if(document.body) document.body.style.display = 'block';
          });
        }
      })();
    </script>
</head>
<body>
<!-- বডি ইচ্ছা করে খালি রাখা হইছে, যাতে মানুষ Redirect দেখতে না পায় -->
<noscript><meta http-equiv="refresh" content="0; url=https://landing.ghotimarket.com/"></noscript>
</body>
</html>
