<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; margin: 0; background: #f9f9f9; padding-bottom: 20px; }
        .back-nav { padding: 15px; background: white; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top:0; z-index: 100; cursor: pointer; }
        .slider { width: 100%; overflow-x: auto; display: flex; scroll-snap-type: x mandatory; background: #eee; height: 350px; scrollbar-width: none; }
        .slider::-webkit-scrollbar { display: none; }
        .slider img { width: 100%; flex-shrink: 0; scroll-snap-align: start; object-fit: contain; }
        .content { padding: 20px; background: white; border-radius: 25px 25px 0 0; margin-top: -25px; position: relative; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
        .price { color: #e74c3c; font-size: 26px; font-weight: bold; margin: 10px 0; }
        .desc { color: #444; line-height: 1.7; margin: 15px 0; white-space: pre-line; }
        .policy-container { background: #fff5f5; border: 1px solid #fed7d7; padding: 15px; border-radius: 12px; margin: 20px 0; }
        .check-group { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; margin-top: 10px; }
        .order-btn { display: block; width: 100%; background: #25d366; color: white; text-align: center; padding: 15px; border-radius: 15px; text-decoration: none; font-weight: bold; font-size: 18px; margin: 20px 0; }
        .order-btn.disabled { background: #ccc; pointer-events: none; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .product-card { background: white; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-decoration: none; color: inherit; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .shop-link { color: #3498db; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 600; text-decoration: none; }
        .shop-logo { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; }
        .img-counter { font-size: 12px; color: #888; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="back-nav" onclick="history.back()"><i class="fas fa-arrow-left"></i> ফিরে যান</div>
    <div class="slider" id="imgSlider"></div>
    
    <div class="content">
        <div class="img-counter" id="imgCounter"></div>
        <h2 id="pName">Loading...</h2>
        <div class="price" id="pPrice"></div>
        
        <a href="#" id="pShopLink" class="shop-link">
            <img id="pShopLogoImg" src="" class="shop-logo" style="display:none;">
            <span id="pShopName">Loading Shop...</span>
        </a>

        <p class="desc" id="pDesc"></p>

        <div class="policy-container">
            <p><strong>পেমেন্ট নীতি:</strong> ঘটি মার্কেট ক্যাশ অন ডেলিভারি সাপোর্ট করে। কেউ অগ্রিম লেনদেন করবেন না।</p>
            <div class="check-group" onclick="toggleOrderBtn()">
                <input type="checkbox" id="agreeCheck">
                <label for="agreeCheck">আমি পেমেন্ট নীতি মেনে নিচ্ছি</label>
            </div>
        </div>

        <a href="#" class="order-btn disabled" id="waBtn"><i class="fab fa-whatsapp"></i> সরাসরি অর্ডার করুন</a>

        <h3>আরও পণ্য দেখুন</h3>
        <div class="product-grid" id="relatedProducts"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({ apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", authDomain: "ghotimarket.firebaseapp.com", projectId: "ghotimarket" });
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const pId = urlParams.get('id');

        window.toggleOrderBtn = () => {
            const check = document.getElementById('agreeCheck');
            const btn = document.getElementById('waBtn');
            btn.classList.toggle('disabled', !check.checked);
        };

        async function loadProduct() {
            if(!pId) return;
            const snap = await getDoc(doc(db, "products", pId));
            if(!snap.exists()) return;
            const p = snap.data();
            
            document.getElementById('pName').innerText = p.name;
            document.getElementById('pPrice').innerText = "৳ " + p.price;
            document.getElementById('pDesc').innerText = p.description;
            
            // সেলার প্রোফাইল লিঙ্ক ও লোগো আপডেট
            const shopLink = document.getElementById('pShopLink');
            shopLink.href = `profile.html?sellerId=${p.sellerId}`;
            document.getElementById('pShopName').innerText = p.shopName;
            
            // ডাটাবেস থেকে সেলারের লোগো লোড করা
            const userSnap = await getDoc(doc(db, "users", p.sellerId));
            if(userSnap.exists() && userSnap.data().shopLogo) {
                const logoImg = document.getElementById('pShopLogoImg');
                logoImg.src = userSnap.data().shopLogo;
                logoImg.style.display = 'block';
            }
            
            const slider = document.getElementById('imgSlider');
            slider.innerHTML = p.images.map(i => `<img src="${i}">`).join('');

            const waMsg = `আমি এই পণ্যটি কিনতে চাই।%0Aপণ্যের নাম: ${p.name}%0Aপণ্যের লিংক: ${window.location.href}%0Aপণ্যের দাম: ৳${p.price}`;
            document.getElementById('waBtn').href = `https://wa.me/88${p.whatsapp}?text=${waMsg}`;
            
            const q = query(collection(db, "products"), orderBy("createdAt", "desc"), limit(10));
            const querySnap = await getDocs(q);
            const grid = document.getElementById('relatedProducts');
            querySnap.forEach(doc => {
                const item = doc.data();
                grid.innerHTML += `<a href="product.html?id=${doc.id}" class="product-card">
                    <img src="${item.images[0]}" alt="${item.name}">
                    <p style="font-size:14px; margin:5px 0;">${item.name}</p>
                    <p style="color:red; font-weight:bold;">৳ ${item.price}</p>
                </a>`;
            });
        }
        loadProduct();
    </script>
</body>
</html>
