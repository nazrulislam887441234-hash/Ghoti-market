<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOTI MARKET - পণ্যের বিস্তারিত</title>
    <meta name="description" content="GHOTI MARKET থেকে সেরা দামে পণ্য কিনুন">
    <link rel="canonical" href="https://ghotimarket.com/product.html">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <meta property="og:title" content="GHOTI MARKET">
    <meta property="og:description" content="সেরা দামে পণ্য কিনুন">
    <meta property="og:image" content="https://ghotimarket.com/assets/logo.png">
    <meta property="og:url" content="https://ghotimarket.com/product.html">
    <meta property="og:type" content="product">
    <link rel="stylesheet" href="product.css">
</head>
<body>
    <div class="back-nav" id="backNavBtn">
        <i class="fas fa-arrow-left"></i> ফিরে যান
    </div>

    <div id="loader" class="loading">
        <i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...
    </div>

    <div id="mainContent" class="main-content-wrapper">
        <div class="slider" id="imgSlider"></div>
        <div class="content">
            <div class="img-counter" id="imgCounter"></div>
            <h2 id="pName"></h2>
            <div class="price-box">
                <span class="current-price" id="pPrice"></span>
                <span class="old-price" id="oldPrice"></span>
                <span class="discount-badge" id="discountBadge"></span>
            </div>

            <a href="#" id="pShopLink" class="shop-link">
                <img id="pShopLogoImg" src="" class="shop-logo" alt="Shop Logo">
                <span id="pShopName"></span>
                <i id="verifiedBadge" class="fas fa-circle-check verified-badge" title="Verified Shop"></i>
            </a>

            <p class="desc" id="pDesc"></p>

            <a href="#" id="orderNowBtn" class="order-btn">
                <i class="fas fa-cart-shopping"></i> এখনই কিনুন
            </a>

            <button class="share-btn" id="shareBtnTrig" type="button">
                <i class="fas fa-share-alt"></i> Share
            </button>

            <h3 id="relatedTitle">আরও পণ্য দেখুন</h3>
            <div class="product-grid" id="relatedProducts"></div>
        </div>
    </div>

    <!-- Universal Popup System -->
    <div id="universalPopup" class="popup">
        <div class="popup-box">
            <i id="popupIcon" class="fas fa-info-circle"></i>
            <h3 id="popupTitle">Notification</h3>
            <p id="popupMessage">Message goes here...</p>
            <button id="popupCloseBtn" type="button">ঠিক আছে</button>
        </div>
    </div>

    <!-- Share Specific Popup -->
    <div id="sharePopup" class="popup">
        <div class="popup-box">
            <h3><i class="fas fa-share-alt"></i> Share Product</h3>
            <button id="shareNowBtn" type="button"><i class="fas fa-paper-plane"></i> Share Now</button>
            <button id="copyLinkBtn" type="button" class="btn-secondary-action"><i class="fas fa-link"></i> Copy Link</button>
            <button id="closeSharePopupBtn" type="button" class="btn-cancel-action"><i class="fas fa-times"></i> Cancel</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="https://ghotimarket.com" class="nav-item">
            <i data-lucide="home"></i>
            <span>Home</span>
        </a>
        <a href="https://ghotimarket.com/categories" class="nav-item">
            <i data-lucide="grid"></i>
            <span>Categories</span>
        </a>
        <a href="https://ghotimarket.com/all-product" class="nav-item">
            <i data-lucide="box"></i>
            <span>All product</span>
        </a>
        <a href="https://ghotimarket.com/contact" class="nav-item">
            <i data-lucide="headphones"></i>
            <span>Support</span>
        </a>
        <a href="https://ghotimarket.com/privacy-policy" class="nav-item">
            <i data-lucide="shield-check"></i>
            <span>Privacy</span>
        </a>
        <a href="https://seller.ghotimarket.com/signup" class="nav-item">
            <i data-lucide="store"></i>
            <span>J.Seller</span>
        </a>
    </nav>

    <script type="module" src="product.js"></script>
</body>
</html>
