<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOTI MARKET - পণ্যের বিস্তারিত</title>
<meta name="description" content="GHOTI MARKET থেকে সেরা দামে পণ্য কিনুন">
<link rel="canonical" href="https://ghotimarket.com/product.html">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<meta property="og:title" content="GHOTI MARKET">
<meta property="og:description" content="সেরা দামে পণ্য কিনুন">
<meta property="og:image" content="https://ghotimarket.com/assets/logo.png">
<meta property="og:url" content="https://ghotimarket.com/product.html">
<meta property="og:type" content="product">
<style>
body { font-family: 'Hind Siliguri', sans-serif; margin: 0; background: #f9f9f9; padding-bottom: 80px; }
.back-nav { padding: 15px; background: white; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top:0; z-index: 100; cursor: pointer; font-weight:600;}
.slider { width: 100%; overflow-x: auto; display: flex; scroll-snap-type: x mandatory; background: #eee; height: 350px; scrollbar-width: none; position:relative;}
.slider::-webkit-scrollbar { display: none; }
.slider img { width: 100%; flex-shrink: 0; scroll-snap-align: start; object-fit: contain; background:#f1f1f1; }
.content { padding: 20px; padding-bottom: 100px; background: white; border-radius: 25px 25px 0 0; margin-top: -25px; position: relative; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); }
.price-box{display:flex;align-items:center;gap:10px;margin:10px 0 15px;flex-wrap:wrap;}
.current-price{color:#e53935;font-size:28px;font-weight:bold;}
.old-price{color:#999;text-decoration:line-through;font-size:18px;}
.discount-badge{background:#ff1744;color:#fff;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:bold;}
.desc { color: #444; line-height: 1.7; margin: 15px 0; white-space: pre-line; }
.order-btn { display: block; width: 100%; box-sizing: border-box; background: #25d366; color: white; text-align: center; padding: 15px; border-radius: 15px; text-decoration: none; font-weight: bold; font-size: 18px; margin: 20px 0; }
.order-btn.disabled{ background:#ccc; opacity:.7; pointer-events:none; }
.product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.product-card { background: white; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-decoration: none; color: inherit; cursor:pointer; }
.product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; background:#f1f1f1;}
.shop-link { color: #3498db; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 600; text-decoration: none; }
.shop-logo { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; background:#eee;}
.img-counter { font-size: 12px; color: #888; margin-bottom: 5px; font-weight: bold; }
.bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px) saturate(180%); display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -5px 20px rgba(0,0,0,0.08); border-top: 1px solid rgba(0,0,0,0.05); z-index: 9999; }
.nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #64748b; font-size: 10px; font-weight: 600; transition: 0.2s; width: 25%; }
.nav-item i { font-size: 21px; margin-bottom: 3px; }
.nav-item.active{ color:#25d366; }
.popup{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; justify-content:center; align-items:center; z-index:99999; }
.popup.show{ display:flex; }
.popup-box{ width:90%; max-width:330px; background:#fff; border-radius:18px; padding:25px; text-align:center; animation:pop.25s ease; }
.popup-box i{ font-size:55px; color:#ff9800; margin-bottom:10px; }
.popup-box h3{ margin:10px 0; }
.popup-box p{ color:#555; line-height:1.6; }
.popup-box button{ width:100%; margin-top:20px; padding:13px; border:none; border-radius:12px; background:#25d366; color:#fff; font-size:16px; cursor:pointer; }
@keyframes pop{ from{ transform:scale(.8); opacity:0; } to{ transform:scale(1); opacity:1; } }
.verified-badge{ width:18px; height:18px; background:#1877F2; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(24,119,242,.35); }
.verified-badge svg{ width:10px; height:10px; }
.share-btn{ width:100%; margin-top:12px; padding:15px; border:none; border-radius:15px; background:#1877F2; color:#fff; font-size:17px; font-weight:bold; cursor:pointer; }
.share-btn i{ margin-right:8px; }
.loading{ text-align:center; padding:50px; color:#888; }
</style>
</head>
<body>
<div class="back-nav" onclick="history.back()"><i class="fas fa-arrow-left"></i> ফিরে যান</div>
<div id="loader" class="loading"><i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...</div>

<div id="mainContent" style="display:none;">
<div class="slider" id="imgSlider"></div>

<div class="content">
    <div class="img-counter" id="imgCounter"></div>
    <h2 id="pName"></h2>
    <div class="price-box">
        <span class="current-price" id="pPrice"></span>
        <span class="old-price" id="oldPrice"></span>
        <span class="discount-badge" id="discountBadge" style="display:none;"></span>
    </div>

    <a href="#" id="pShopLink" class="shop-link">
        <img id="pShopLogoImg" src="" class="shop-logo" style="display:none;">
        <span id="pShopName"></span>
        <span id="verifiedBadge" class="verified-badge" style="display:none;">
            <svg viewBox="0 0 24 24" fill="white"><path d="M9.1 13.8l-2.3-2.3c-.4-.4-1-.4-1.4 0-.4.4-.4 1 0 1.4l3 3c.2.2.5.3.7.3.2 0.5-.1.7-.3l5.8-5.8c.4-.4.4-1 0-1.4-.4-.4-1-.4-1.4 0L9.1 13.8z"/></svg>
        </span>
    </a>

    <p class="desc" id="pDesc"></p>
    <a href="#" id="orderNowBtn" class="order-btn"> অর্ডার করুন</a>
    <button class="share-btn" onclick="openSharePopup()"><i class="fas fa-share-alt"></i> Share</button>

    <div id="sharePopup" class="popup">
        <div class="popup-box">
            <h3><i class="fas fa-share-alt"></i> Share Product</h3>
            <button onclick="shareNow()"><i class="fas fa-paper-plane"></i> Share Now</button>
            <button onclick="copyLink()" style="background:#1877F2;margin-top:10px;"><i class="fas fa-link"></i> Copy Link</button>
            <button onclick="closeSharePopup()" style="background:#888;margin-top:10px;"><i class="fas fa-times"></i> Cancel</button>
        </div>
    </div>

    <h3 id="relatedTitle">আরও পণ্য দেখুন</h3>
    <div class="product-grid" id="relatedProducts"></div>
</div>
</div>

<div class="bottom-nav">
    <a href="https://ghotimarket.com" class="nav-item active"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="https://ghotimarket.com/contact.html" class="nav-item"><i class="fas fa-headset"></i><span>Support</span></a>
    <a href="https://seller.ghotimarket.com/signup" class="nav-item"><i class="fas fa-user-plus"></i><span>Join Seller</span></a>
    <a href="https://ghotimarket.com/privacy-policy" class="nav-item"><i class="fas fa-shield-alt"></i><span>Privacy</span></a>
</div>

<div id="copyPopup" class="popup">
    <div class="popup-box">
        <i class="fas fa-check-circle" style="color:#25d366;"></i>
        <h3>সফল হয়েছে</h3>
        <p>পণ্যের লিংক সফলভাবে কপি হয়েছে।</p>
        <button onclick="closeCopyPopup()"><i class="fas fa-check"></i> ঠিক আছে</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, limit, getDocs, doc, getDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({ apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", authDomain: "ghotimarket.firebaseapp.com", projectId: "ghotimarket" });
const db = getFirestore(app);

// ===== GLOBAL STATE =====
let currentSlug = null;
let currentProductCache = null;
let loading = false;

// ===== UTILS =====
const safe = (val, def='') => val?? def;
const safeNum = (val, def=0) => Number(val) || def;
const hide = el => { if(el) el.style.display = 'none'; }
const show = el => { if(el) el.style.display = 'block'; }
const PLACEHOLDER = 'https://via.placeholder.com/400x350?text=No+Image';

// ===== GET SLUG FROM URL =====
function getSlugFromURL(){
    const urlParams = new URLSearchParams(window.location.search);
    let slug = urlParams.get("product-slug");
    if(!slug && window.location.search.startsWith('?')){
        slug = window.location.search.substring(1);
    }
    return slug? decodeURIComponent(slug) : null;
}

// ===== SHARE =====
window.openSharePopup = () => document.getElementById("sharePopup").classList.add("show");
window.closeSharePopup = () => document.getElementById("sharePopup").classList.remove("show");
window.shareNow = async () => {
    const text = `🛒 ${currentProductCache?.name}\n\n💰 ৳${currentProductCache?.price}\n\n📝 ${safe(currentProductCache?.description).substring(0,100)}...`;
    try{
        if(navigator.share){ await navigator.share({ title: currentProductCache?.name, text, url: window.location.href }); }
        else{ copyLink(); }
    }catch(e){}
    closeSharePopup();
}
window.copyLink = async () => {
    try{ await navigator.clipboard.writeText(window.location.href); }catch(e){}
    closeSharePopup();
    document.getElementById("copyPopup").classList.add("show");
}
window.closeCopyPopup = () => document.getElementById("copyPopup").classList.remove("show");

// ===== LOAD PRODUCT BY SLUG =====
async function loadProductBySlug(slug, push = true){
    if(!slug || loading) return;
    loading = true;
    show(document.getElementById("loader"));
    hide(document.getElementById("mainContent"));

    try{
        const q = query(collection(db,"products"), where("slug","==",slug), limit(1));
        const snap = await getDocs(q);

        if(snap.empty){
            await loadRelatedProducts(null, null, true); // show latest if not found
            hide(document.getElementById("loader"));
            show(document.getElementById("mainContent"));
            loading = false;
            return;
        }

        const productDoc = snap.docs[0];
        const productData = productDoc.data();
        currentSlug = slug;
        currentProductCache = productData;

        if(push){
            const newUrl = `product.html?product-slug=${slug}`;
            history.pushState({slug}, '', newUrl);
        }

        renderProduct(productData);
        await loadRelatedProducts(productDoc.id, productData.categorySlug, false);

        hide(document.getElementById("loader"));
        show(document.getElementById("mainContent"));
        window.scrollTo({top:0, behavior:'smooth'});

    }catch(error){
        console.error("Product Load Error:", error);
        hide(document.getElementById("loader"));
        show(document.getElementById("mainContent"));
    }
    loading = false;
}

// ===== RENDER PRODUCT =====
function renderProduct(p){
    const name = safe(p.name, 'Product');
    const desc = safe(p.description, 'GHOTI MARKET Product');
    const img = p.images?.[0] || PLACEHOLDER;
    const price = safeNum(p.price);

    // SEO UPDATE
    document.title = `${name} - ৳${price} | GHOTI MARKET`;
    setMeta('meta[name="description"]', desc.substring(0,160));
    setMeta('meta[property="og:title"]', name);
    setMeta('meta[property="og:description"]', desc.substring(0,160));
    setMeta('meta[property="og:image"]', img);
    setMeta('meta[property="og:url"]', window.location.href);
    document.querySelector('link[rel="canonical"]').setAttribute('href', window.location.href);

    // CONTENT
    document.getElementById("pName").innerText = name;
    document.getElementById("pPrice").innerText = `৳ ${price}`;
    document.getElementById("pDesc").innerText = desc || 'কোন বিবরণ নেই';

    // OLD PRICE
    const oldPrice = safeNum(p.oldPrice);
    if(oldPrice > price){
        document.getElementById("oldPrice").innerText = `৳ ${oldPrice}`;
        const save = oldPrice - price;
        const percent = Math.round((save / oldPrice) * 100);
        const badge = document.getElementById("discountBadge");
        badge.style.display = "inline-block";
        badge.innerText = `-${percent}%`;
    }else{
        hide(document.getElementById("oldPrice"));
        hide(document.getElementById("discountBadge"));
    }

    // SHOP
    const shopLink = document.getElementById("pShopLink");
    const sellerId = safe(p.sellerId);
    shopLink.href = sellerId? `profile.html?sellerId=${sellerId}` : '#';
    document.getElementById("pShopName").innerText = safe(p.shopName, 'Unknown Shop');

    if(sellerId){
        getDoc(doc(db, "users", sellerId)).then(userSnap=>{
            if(userSnap.exists()){
                const user = userSnap.data();
                const logoImg = document.getElementById("pShopLogoImg");
                if(user.shopLogo){
                    logoImg.src = user.shopLogo;
                    logoImg.onerror = () => hide(logoImg);
                    show(logoImg);
                }else hide(logoImg);
                if(user.verified === true || user.verified === "true"){
                    show(document.getElementById("verifiedBadge"));
                }else hide(document.getElementById("verifiedBadge"));
            }
        }).catch(()=>{});
    }else{
        hide(document.getElementById("pShopLogoImg"));
        hide(document.getElementById("verifiedBadge"));
    }

    // IMAGES
    const slider = document.getElementById("imgSlider");
    const images = Array.isArray(p.images)? p.images : [];
    if(images.length > 0){
        slider.innerHTML = images.map(img => `<img src="${img}" alt="${name}" onerror="this.src='${PLACEHOLDER}'">`).join("");
        document.getElementById("imgCounter").innerText = `ছবি ${images.length} টি`;
    }else{
        slider.innerHTML = `<img src="${PLACEHOLDER}" alt="No Image">`;
        document.getElementById("imgCounter").innerText = `ছবি 0 টি`;
    }

    // ORDER BUTTON - ONLY SLUG
    const orderBtn = document.getElementById("orderNowBtn");
    if(p.slug){
        orderBtn.href = `order.html?product-slug=${p.slug}`;
        orderBtn.classList.remove('disabled');
    }else{
        orderBtn.href = '#';
        orderBtn.classList.add('disabled');
    }
}

function setMeta(selector, content){
    const el = document.querySelector(selector);
    if(el) el.setAttribute('content', content);
}

// ===== RELATED PRODUCTS =====
async function loadRelatedProducts(currentId, categorySlug, isFallback){
    try{
        let q;
        if(categorySlug &&!isFallback){
            q = query(collection(db,"products"), where("categorySlug","==",categorySlug), orderBy("createdAt","desc"), limit(10));
            document.getElementById("relatedTitle").innerText = "একই ক্যাটাগরির পণ্য";
        }else{
            q = query(collection(db,"products"), orderBy("createdAt","desc"), limit(10));
            document.getElementById("relatedTitle").innerText = "সর্বশেষ পণ্য";
        }

        const snap = await getDocs(q);
        const grid = document.getElementById("relatedProducts");
        grid.innerHTML = "";

        snap.forEach(productDoc => {
            if(productDoc.id === currentId) return;
            const item = productDoc.data();
            if(!item.slug) return; // slug must exist

            const itemPrice = safeNum(item.price);
            const itemOldPrice = safeNum(item.oldPrice);

            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${item.images?.[0] || PLACEHOLDER}" alt="${safe(item.name)}" onerror="this.src='${PLACEHOLDER}'">
                <p style="font-size:14px;margin:8px 0;font-weight:600;">${safe(item.name)}</p>
                <div class="price-box">
                    <span class="current-price">৳ ${itemPrice}</span>
                    ${itemOldPrice > itemPrice? `<span class="old-price">৳ ${itemOldPrice}</span>` : ""}
                </div>
            `;
            card.onclick = () => loadProductBySlug(item.slug, true);
            grid.appendChild(card);
        });
    }catch(e){ console.error("Related products error", e); }
}

// ===== POPSTATE FOR BACK/FORWARD =====
window.addEventListener('popstate', (event) => {
    const slug = event.state?.slug || getSlugFromURL();
    if(slug) loadProductBySlug(slug, false);
});

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
    const slug = getSlugFromURL();
    if(slug){
        loadProductBySlug(slug, false);
    }else{
        loadRelatedProducts(null, null, true);
        hide(document.getElementById("loader"));
        show(document.getElementById("mainContent"));
    }
});
</script>
</body>
</html>
