<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Product | Ghoti Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #2ecc71; --bg: #f8f9fa; }
        body { font-family: 'Hind Siliguri', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        
        /* Security Loader */
        #lock-screen { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; justify-content: center; align-items: center; }

        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; font-size: 22px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #555; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-color: var(--accent); }

        /* Image Upload UI */
        .img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .img-box { background: #f1f2f6; border: 2px dashed #ccc; border-radius: 10px; height: 100px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .img-box i { font-size: 24px; color: #aaa; }
        .img-box input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; display: none; }

        /* Keywords Section */
        .kw-box { background: #f9f9f9; padding: 10px; border-radius: 10px; border: 1px solid #eee; }
        #kwList { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
        .keyword-tag { background: var(--accent); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        .keyword-tag i { cursor: pointer; }

        .up-btn { width: 100%; padding: 15px; background: var(--success); color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer; transition: 0.2s; }
        .up-btn:active { transform: scale(0.98); }
        .up-btn:disabled { background: #ccc; }

        .back-link { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div style="text-align: center;">
            <i class="fas fa-spinner fa-spin" style="font-size: 40px; color: var(--accent);"></i>
            <p>সিকিউরিটি চেক করা হচ্ছে...</p>
        </div>
    </div>

    <div class="container">
        <h2><i class="fas fa-cloud-upload-alt"></i> নতুন পণ্য যোগ করুন</h2>
        
        <div class="form-group">
            <label>পণ্যের নাম</label>
            <input type="text" id="pName" placeholder="উদা: প্রিমিয়াম কটন পাঞ্জাবি">
        </div>

        <div class="form-group">
            <label>বিস্তারিত বর্ণনা</label>
            <textarea id="pDesc" placeholder="সাইজ, কালার ও ফেব্রিক সম্পর্কে লিখুন..."></textarea>
        </div>

        <div class="form-group">
            <label>দাম (৳)</label>
            <input type="number" id="pPrice" placeholder="কত টাকায় বিক্রি করবেন?">
        </div>

        <label>পণ্যর ছবি (সর্বোচ্চ ২টি, প্রতিটি ২ এমবি)</label>
        <div class="img-grid">
            <div class="img-box" id="box1"><i class="fas fa-camera"></i><img id="view1"><input type="file" id="img1" accept="image/*" onchange="previewImg(this, 'view1', 'box1')"></div>
            <div class="img-box" id="box2"><i class="fas fa-camera"></i><img id="view2"><input type="file" id="img2" accept="image/*" onchange="previewImg(this, 'view2', 'box2')"></div>
        </div>

        <div class="form-group">
            <label>কিওয়ার্ড (সার্চের জন্য - সর্বোচ্চ ৫০টি)</label>
            <div class="kw-box">
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="kwInput" placeholder="উদা: পাঞ্জাবি" style="padding: 8px;">
                    <button onclick="addKW()" style="background:var(--primary); color:white; border:none; padding:0 15px; border-radius:8px;">Add</button>
                </div>
                <div id="kwList"></div>
            </div>
        </div>

        <button onclick="uploadProduct()" id="upBtn" class="up-btn">আপলোড শুরু করুন</button>
        <a href="dashboard.html" class="back-link">ফিরে যান</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", 
            projectId: "ghotimarket",
            authDomain: "ghotimarket.firebaseapp.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const imgbbKey = "e1da51b6d309ac3a5a235b5088ebc334";

        let keywords = [];
        let userData = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                userData = userSnap.data();
                if (!userData || userData.profileUnlockedUntil < Date.now()) {
                    window.location.href = "locked.html";
                } else {
                    document.getElementById('lock-screen').style.display = 'none';
                }
            } else {
                window.location.href = "login.html";
            }
        });

        // ইমেজ প্রিভিউ এবং ২ এমবি সাইজ চেক
        window.previewImg = (input, viewId, boxId) => {
            const file = input.files[0];
            const maxSizeBytes = 2 * 1024 * 1024; // 2MB

            if (file) {
                if (file.size > maxSizeBytes) {
                    alert("দুঃখিত! এই ছবিটির সাইজ ২ এমবি-র চেয়ে বেশি। দয়া করে ছোট সাইজের ছবি দিন।");
                    input.value = ""; // ফাইল রিসেট
                    document.getElementById(viewId).style.display = 'none'; // আগের ছবি থাকলে মুছে দাও
                    document.getElementById(boxId).style.border = '2px dashed #ccc'; // বর্ডার ফিরিয়ে আনো
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById(viewId).src = e.target.result;
                    document.getElementById(viewId).style.display = 'block';
                    document.getElementById(boxId).style.border = 'none';
                };
                reader.readAsDataURL(file);
            }
        };

        window.addKW = () => {
            const val = document.getElementById('kwInput').value.trim();
            if (val && keywords.length < 50) {
                keywords.push(val.toLowerCase());
                renderKeywords();
                document.getElementById('kwInput').value = "";
            }
        };

        function renderKeywords() {
            document.getElementById('kwList').innerHTML = keywords.map((k, i) => `
                <div class="keyword-tag">${k} <i class="fas fa-times" onclick="removeKW(${i})"></i></div>
            `).join('');
        }

        window.removeKW = (index) => {
            keywords.splice(index, 1);
            renderKeywords();
        };

        window.uploadProduct = async () => {
            const btn = document.getElementById('upBtn');
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const desc = document.getElementById('pDesc').value;
            const f1 = document.getElementById('img1').files[0];
            const f2 = document.getElementById('img2').files[0];

            if (!name || !price || !f1) return alert("নাম, দাম এবং অন্তত ১টি ছবি দিন!");

            // আপলোডের আগেও শেষবারের মতো সাইজ চেক
            if (f1.size > 2 * 1024 * 1024 || (f2 && f2.size > 2 * 1024 * 1024)) {
                return alert("ছবির সাইজ ২ এমবি-র বেশি হওয়ার কারণে আপলোড সম্ভব নয়!");
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> আপলোড হচ্ছে...';

            try {
                const imgUrls = [];
                const files = [f1, f2];

                for (let file of files) {
                    if (file) {
                        const formData = new FormData();
                        formData.append("image", file);
                        const res = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbKey}`, { method: "POST", body: formData });
                        const json = await res.json();
                        if(json.success) imgUrls.push(json.data.url);
                    }
                }

                await addDoc(collection(db, "products"), {
                    name,
                    description: desc,
                    price: parseInt(price),
                    keywords,
                    images: imgUrls,
                    sellerId: auth.currentUser.uid,
                    shopName: userData.shopName,
                    whatsapp: userData.whatsapp,
                    active: true,
                    createdAt: Date.now()
                });

                alert("পণ্যটি সফলভাবে শপে যোগ করা হয়েছে!");
                window.location.href = "dashboard.html";

            } catch (err) {
                alert("আপলোড সমস্যা হয়েছে। আবার চেষ্টা করুন।");
                btn.disabled = false;
                btn.innerText = "আপলোড শুরু করুন";
            }
        };
    </script>
</body>
</html>
