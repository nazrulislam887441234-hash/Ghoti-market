<!DOCTYPE html>    
<html lang="bn">    
<head>    
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <meta name="referrer" content="no-referrer-when-downgrade">    
    <title>Ghoti market || Mega fest 2026</title>    
    <style>    
        html, body {    
            margin: 0;    
            padding: 0;    
            background-color: #ffffff;    
            width: 100%;    
            height: 100%;    
            overflow: hidden;    
        }    
    </style>    
</head>    
<body>    <!-- Firebase v10+ Modular SDK -->    
<script type="module">    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";    
    import {     
        getFirestore,     
        collection,     
        query,     
        where,     
        getDocs,     
        limit,     
        addDoc,     
        serverTimestamp     
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";    

    // Firebase Configuration (Project: ghotimarket)    
    const firebaseConfig = {    
        apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE",    
        authDomain: "ghotimarket.firebaseapp.com",    
        databaseURL: "https://ghotimarket-default-rtdb.firebaseio.com",    
        projectId: "ghotimarket",    
        storageBucket: "ghotimarket.firebasestorage.app",    
        messagingSenderId: "481257644093",    
        appId: "1:481257644093:web:0dfc3699d6b3c86afeca54",    
        measurementId: "G-4SR8V2EKC1"    
    };    

    // Initialize Firebase    
    const app = initializeApp(firebaseConfig);    
    const db = getFirestore(app);    

    (async function executeSilentRedirect() {    
        try {    
            // ১. Firestore থেকে active == true এবং isDefault == true লিংক কুয়েরি    
            const linksRef = collection(db, "links");    
            const q = query(    
                linksRef,     
                where("active", "==", true),     
                where("isDefault", "==", true),     
                limit(1)    
            );    

            const querySnapshot = await getDocs(q);    

            if (querySnapshot.empty) {    
                console.error("No active default redirect link found.");    
                return;    
            }    

            // লিংকের তথ্য সংগ্রহ    
            const linkDoc = querySnapshot.docs[0];    
            const linkId = linkDoc.id;    
            const linkData = linkDoc.data();    
            const targetUrl = linkData.url;    
            const linkTitle = linkData.title || "Untitled Link";    

            if (!targetUrl) {    
                console.error("Target URL missing.");    
                return;    
            }    

            // ২. সিকিউরিটি রুলস মেনে শুধুমাত্র views কালেকশনে নতুন ডকুমেন্ট তৈরি (CREATE)    
            const trackingPromise = addDoc(collection(db, "views"), {    
                linkId: linkId,    
                linkTitle: linkTitle,    
                timestamp: serverTimestamp(),    
                referrer: document.referrer || "Direct / None",    
                userAgent: navigator.userAgent    
            });    

            // স্লো নেটওয়ার্কের কারণে ইউজার যেন আটকে না থাকে, তার জন্য ১.২ সেকেন্ডের সেফটি টাইমআউট    
            const timeoutPromise = new Promise((resolve) => setTimeout(resolve, 1200));    

            // ট্র্যাকিং সম্পন্ন হওয়া অথবা টাইমআউটের মধ্যে যেটি দ্রুত ঘটে    
            await Promise.race([trackingPromise, timeoutPromise]).catch(err => {    
                console.error("Tracking error or timeout:", err);    
            });    

            // ৩. সাইড এফেক্ট ছাড়া দ্রুত ডেস্টিনেশন URL-এ রিডাইরেক্ট    
            window.location.replace(targetUrl);    

        } catch (error) {    
            console.error("Redirect execution error:", error);    
        }    
    })();    
</script>

</body>    
</html>
