<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড রিসেট - ঘটি মার্কেট</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #004e92, #000428);
            --accent-color: #00a8ff;
            --text-color: #2c3e50;
        }
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--primary-gradient);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }
        h2 {
            color: var(--text-color);
            margin-bottom: 5px;
            font-size: 22px;
        }
        .user-email {
            background: #f0f4f8;
            padding: 8px 15px;
            border-radius: 50px;
            display: inline-block;
            color: #555;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid #d1d9e6;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 168, 255, 0.2);
        }
        button {
            width: 100%;
            padding: 15px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        #message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.ibb.co/27wykyRH/20260425-143935.png" alt="Ghoti Market Logo" class="logo">
        <h2 id="title">পাসওয়ার্ড রিসেট</h2>
        
        <div id="email-display" class="user-email" style="display:none;"></div>
        
        <p class="subtitle" id="subtitle">আপনার ঘটি মার্কেট অ্যাকাউন্টের জন্য একটি শক্তিশালী পাসওয়ার্ড সেট করুন।</p>
        
        <div id="input-area">
            <div class="input-group">
                <input type="password" id="new-password" placeholder="নতুন পাসওয়ার্ড লিখুন...">
            </div>
            <button onclick="handleReset()">পাসওয়ার্ড আপডেট করুন</button>
        </div>
        
        <div id="message"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBUhNhYvuo_FTvZ5RZR6Gn-4hsUY21S0XE", 
            projectId: "ghotimarket" 
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');

        // পেজ লোড হওয়ার সময় ইউজারের ইমেইল উদ্ধার করা
        if (actionCode) {
            verifyPasswordResetCode(auth, actionCode)
                .then((email) => {
                    const emailDiv = document.getElementById('email-display');
                    emailDiv.innerText = email;
                    emailDiv.style.display = 'inline-block';
                })
                .catch((error) => {
                    showError("লিঙ্কটি ভুল বা মেয়াদোত্তীর্ণ। দয়া করে আবার চেষ্টা করুন।");
                });
        } else {
            showError("ভ্যালিড অ্যাকশন কোড পাওয়া যায়নি।");
        }

        window.handleReset = async () => {
            const newPassword = document.getElementById('new-password').value;
            const msg = document.getElementById('message');

            if(newPassword.length < 6) {
                msg.style.display = "block";
                msg.style.color = "#e74c3c";
                msg.innerText = "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!";
                return;
            }

            try {
                await confirmPasswordReset(auth, actionCode, newPassword);
                msg.style.display = "block";
                msg.style.color = "#2ecc71";
                msg.style.background = "#eafaf1";
                msg.innerText = "অভিনন্দন! পাসওয়ার্ড সফলভাবে আপডেট হয়েছে।";
                
                document.getElementById('input-area').style.display = "none";
                document.getElementById('subtitle').innerText = "আপনার নতুন পাসওয়ার্ড দিয়ে এখন অ্যাপে লগইন করতে পারবেন।";
            } catch (error) {
                showError("পাসওয়ার্ড রিসেট করতে সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।");
            }
        };

        function showError(text) {
            const msg = document.getElementById('message');
            msg.style.display = "block";
            msg.style.color = "#e74c3c";
            msg.style.background = "#fdedec";
            msg.innerText = text;
            document.getElementById('input-area').style.display = "none";
        }
    </script>
</body>
</html>
